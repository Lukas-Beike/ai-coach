<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pacecraft Mockup A · Feinschliff</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
.mv{font-family:var(--font-sans,system-ui,sans-serif);color:var(--foreground,#888)}
.mv-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.mv-bar select,.mv-bar button{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border,#8886);background:var(--card,transparent);color:inherit;font:600 13px var(--font-sans,system-ui,sans-serif);cursor:pointer}
.mv-bar select{flex:1 1 220px;min-width:0}
.mv-bar button[aria-pressed=true]{background:var(--foreground,#888);color:var(--background,#fff)}
.mv-grp{display:flex;gap:4px}
.mv-stage{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.mv-frame{margin:0}
.mv-frame figcaption{font:600 12px var(--font-sans,system-ui,sans-serif);opacity:.75;margin-bottom:6px}
.mv-clip{overflow:hidden;border-radius:14px;outline:1px solid var(--border,#8886)}
.mv-clip .app{transform-origin:0 0}
.app.full{height:auto!important}.app.full .shell{position:relative;min-height:inherit}.app.full .main{overflow:visible}.app.full .login{position:relative;min-height:inherit}
/* Structural base shared by all directions. Look comes from tokens + direction overrides. */
.app{container:app/inline-size;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;text-align:left;
  --sp-run:var(--run);--sp-ride:var(--ride);--sp-strength:var(--strength);--nav-h:68px}
.app *,.app *::before,.app *::after{box-sizing:border-box;margin:0}
.app button,.app input,.app select,.app textarea{font:inherit;color:inherit}
.app a{color:var(--accent-text)}
.app ul{padding:0;list-style:none}
.app h1,.app h2,.app h3,.app h4{font-family:var(--font-d);line-height:1.2;font-weight:650}
.app h1{font-size:26px}.app h2{font-size:18px}.app h3{font-size:16px}.app h4{font-size:13px;color:var(--muted);margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{position:absolute;inset:0;display:flex;flex-direction:column}
.main{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.nav{flex:none;order:2;height:var(--nav-h);display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;font-size:11px;font-weight:600;text-decoration:none;color:var(--muted)!important}
.nav-item[aria-current]{color:var(--accent-text)!important}
.page{padding:16px 16px 28px;display:grid;gap:16px;max-width:1080px;margin:0 auto;align-content:start}
.page>*,.grid2>*,.more-body>*,.cal-col>*{min-width:0}
.page-h{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
.center{text-align:center}
.grid2{display:grid;gap:16px}
.list{display:grid;gap:12px}
.foot{font-size:12.5px;color:var(--muted)}
.u{font-size:.72em;font-weight:500;color:var(--muted);font-family:var(--font)}

/* controls */
.btn{min-height:44px;padding:0 16px;border-radius:var(--r-btn);border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-text);padding:0 10px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.ghost.danger{border-color:transparent}
.btn.block{width:100%}
.btn .ic{width:18px;height:18px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:var(--r-btn);border:0;background:transparent;color:var(--muted);display:inline-grid;place-items:center;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:1 0 auto;min-height:44px;padding:0 14px;display:grid;place-items:center;text-decoration:none;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;border-radius:var(--r-btn)}
.tabs a[aria-current]{color:var(--ink);background:var(--surface-2)}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:var(--r-btn);padding:3px;gap:2px;justify-self:start}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:calc(var(--r-btn) - 3px);background:transparent;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap;position:relative}
.seg button::after{content:"";position:absolute;inset:-3px 0}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.field{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field>span:first-child{display:flex;gap:8px;align-items:center;justify-content:space-between}
.app input,.app select,.app textarea{min-height:44px;width:100%;padding:0 12px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--input);color:var(--ink);font-weight:500;font-size:15px}
.app input::placeholder,.app textarea::placeholder{color:var(--muted);opacity:1}
.pw{display:flex;gap:8px}.pw input{flex:1;min-width:0}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.switch input{position:absolute;opacity:0;width:1px;min-height:0;height:1px}
.switch i{width:44px;height:26px;border-radius:99px;background:var(--line-2);position:relative;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:.15s}
.switch input:checked+i{background:var(--accent)}.switch input:checked+i::after{left:21px;background:var(--on-accent)}
.file{display:flex;align-items:center;gap:10px}.file em{font-style:normal;font-weight:400}

/* chips, sources */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:650;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.ok,.chip.warn,.chip.err,.chip.off{background:transparent;border:1px solid var(--line-2)}
.chip.ok::before,.chip.warn::before,.chip.err::before,.chip.off::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chip.warn::before{background:var(--warn)}.chip.err::before{background:var(--danger)}.chip.off::before{background:var(--muted)}
.chip.est{background:transparent;border:1px dashed var(--muted);color:var(--muted);font-weight:600}
.src{font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:4px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.src[data-src=garmin]{color:var(--src-garmin);border-color:color-mix(in srgb,var(--src-garmin) 45%,transparent)}
.src[data-src=wahoo]{color:var(--src-wahoo);border-color:color-mix(in srgb,var(--src-wahoo) 45%,transparent)}
.src[data-src=ai]{border-style:dashed}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted)}
.tag.is-derived{border-style:dashed}

/* cards */
.card,.acc,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start}
.box{background:transparent;border-radius:var(--r-s);padding:14px}
.card-h{display:flex;align-items:center;gap:8px;min-height:28px;flex-wrap:wrap}
.card-h h3{flex:1}
.card-h .icon-btn,.group .icon-btn{margin:-10px -10px -10px 0}
.group{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.acc{padding:0;gap:0}
.acc>summary,.sec>summary,.sec2>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 16px;flex-wrap:wrap}
.acc>summary::-webkit-details-marker,.sec>summary::-webkit-details-marker,.sec2>summary::-webkit-details-marker,.unit>summary::-webkit-details-marker{display:none}
.acc-t{font-family:var(--font-d);font-weight:650;font-size:16px;flex:1}
.acc-m{font-size:13px;color:var(--muted)}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
.acc-b{padding:4px 16px 16px;display:grid;gap:14px}
.sec{padding:0;gap:0}.sec>summary{justify-content:space-between}.sec>.kv{padding:0 16px 10px}
.sec2{display:grid;gap:12px}.sec2>summary{padding:0;min-height:44px;justify-content:space-between}.sec2 .group{margin:0;justify-content:flex-start}
.more>summary{min-height:44px;display:flex;align-items:center;font-size:13.5px;font-weight:600;color:var(--accent-text);cursor:pointer}
.sub>summary{min-height:44px;display:flex;align-items:center;font-weight:650;cursor:pointer}
.sub{display:grid;gap:12px}
.eq-line{flex:1 0 100%;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.life{flex:1 0 100%;height:4px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-bottom:6px}.life i{display:block;height:100%;background:var(--accent)}
.lines{display:grid;gap:4px;font-size:14px}
.notice,.alert{font-size:13px;padding:12px 14px;border-radius:var(--r-s);background:var(--surface-2);color:var(--ink)}
.alert{display:grid;gap:4px;border-left:3px solid var(--warn)}
.setrow{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between;padding:6px 0}
.setrow>div{display:grid;gap:2px;flex:1 1 200px}.setrow>div span{font-size:13px;color:var(--muted)}
.setrow+.setrow{border-top:1px solid var(--line);padding-top:14px}
.card.setrow{padding:12px 16px}
.savebar{position:sticky;bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow)}
.fresh{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}.fresh .btn{justify-self:start}
.progress{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;padding:12px 16px;border-radius:var(--r);background:var(--accent-soft);font-size:14px}
.progress progress{grid-column:1/-1;width:100%;height:6px;appearance:none;border:0;border-radius:9px;overflow:hidden;background:var(--line-2)}
.progress progress::-webkit-progress-bar{background:var(--line-2)}.progress progress::-webkit-progress-value{background:var(--accent-text)}
.logs{font:12px/1.5 ui-monospace,Consolas,monospace;padding:12px;border-radius:var(--r-s);background:var(--surface-2);overflow:auto;white-space:pre}

/* data */
.kv{display:grid}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.kv>div:first-child{border-top:0}
.kv dt{color:var(--muted);font-size:14px}.kv dd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.kv dd b{font-family:var(--font-n);font-size:17px;font-weight:650}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:grid;gap:2px;padding:12px;border-radius:var(--r-s);background:var(--surface-2);align-content:start}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--font-n);font-size:22px;font-weight:650;line-height:1.15}
.tile .chip{justify-self:start;margin-top:4px}
.tiles.nut{grid-template-columns:repeat(3,1fr)}
.tiles.nut .hero{grid-column:1/-1}.tiles.nut .hero .v{font-size:38px}
.tiles.nut .tile{background:var(--surface);border:1px solid var(--line)}
.tile.below{box-shadow:inset 0 -3px 0 var(--warn)}.tile.above{box-shadow:inset 0 -3px 0 var(--info)}
.tiles.facts .tile{padding:10px 12px}.tiles.facts .v{font-size:19px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:650;color:var(--muted);text-align:right;padding:6px 6px}
.tbl td{padding:9px 6px;border-top:1px solid var(--line);text-align:right;font-family:var(--font-n)}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0;font-family:var(--font)}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl.thr td b{font-family:var(--font-n);font-size:18px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{font:500 9.5px var(--font);fill:var(--muted)}
.chart .band{fill:var(--muted);opacity:.16}
.chart .avg{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.chart .dashed{stroke-dasharray:6 4}
.chart .area{opacity:.12;stroke:none}
.c0{--c:var(--c0)}.c1{--c:var(--c1)}.c2{--c:var(--c2)}.c3{--c:var(--c3)}.c4{--c:var(--c4)}
.chart .line{stroke:var(--c)}.chart .area,.chart .bar,.chart .dot{fill:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:0 14px}
.lg{min-height:44px;border:0;background:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.lg i{width:14px;height:3px;border-radius:2px;background:var(--c0)}
.lg[data-c="1"] i{background:var(--c1)}.lg[data-c="2"] i{background:var(--c2)}.lg[data-c="3"] i{background:var(--c3)}.lg[data-c="4"] i{background:var(--c4)}
.legend.plain{gap:6px 16px;font-size:13.5px}.legend.plain li{display:flex;align-items:center;gap:6px}
.mini{display:grid;gap:4px}.mini header{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted)}.mini h4{margin:0}
[data-z="1"]{--z:var(--z1)}[data-z="2"]{--z:var(--z2)}[data-z="3"]{--z:var(--z3)}[data-z="4"]{--z:var(--z4)}[data-z="5"]{--z:var(--z5)}[data-z="6"]{--z:var(--z6)}[data-z="7"]{--z:var(--z7)}
.zf1{fill:var(--z1)}.zf2{fill:var(--z2)}.zf3{fill:var(--z3)}.zf4{fill:var(--z4)}.zf5{fill:var(--z5)}.zf6{fill:var(--z6)}.zf7{fill:var(--z7)}
.sw{width:12px;height:12px;border-radius:3px;background:var(--z);flex:none;display:inline-block}
.zones{display:grid;gap:2px}
.zone{display:grid;grid-template-columns:12px 26px auto 1fr auto;gap:8px;align-items:center;min-height:30px;font-size:14px}
.zone b{font-weight:700}.zone .zn{color:var(--muted)}.zone .zv{grid-column:-2/-1;font-family:var(--font-n);font-weight:600;text-align:right;white-space:nowrap}
.zbar{grid-column:3/5;height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}.zbar i{display:block;height:100%;background:var(--z);border-radius:9px;min-width:3px}
.share{display:flex;height:14px;border-radius:9px;overflow:hidden;gap:2px}.share i{background:var(--z)}
.zleg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}.zleg li{display:flex;gap:5px;align-items:center}
.profile svg{display:block;width:100%;height:56px}
.profile-ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}

/* login */
.login{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.login-card{width:min(100%,360px);display:grid;gap:18px}
.brand{font-weight:700;color:var(--accent-text);font-size:14px}

/* coach */
.page.coach{max-width:800px;min-height:100%;grid-template-rows:auto 1fr auto;padding-bottom:0}
.strip{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:13.5px;flex-wrap:wrap}
.strip .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}.strip span{color:var(--muted);flex:1}.strip a{min-height:44px;display:grid;place-items:center;padding:0 8px;font-weight:650}
.msgs{display:grid;gap:14px;align-content:end}
.load-more{justify-self:center}
.msg{display:grid;gap:8px;max-width:100%}
.msg.user{justify-self:end;max-width:86%;padding:10px 14px;background:var(--bubble);border-radius:var(--r) var(--r) 6px var(--r)}
.msg ul{padding-left:18px;list-style:disc;display:grid;gap:2px}
.msg-actions{display:flex;margin:-6px 0 -6px -10px}.msg.user .msg-actions{justify-content:flex-end;margin:-6px -10px -8px 0}
.msg-actions .ic{width:17px;height:17px}
.msg.pending{opacity:.92;border:1px dashed var(--line-2);background:transparent}.msg.pending small{font-weight:650;color:var(--muted)}
.plan-note{font-size:13.5px;padding:10px 12px;border-radius:var(--r-s);background:var(--surface-2)}
.receipt{display:flex;align-items:center;gap:8px;padding:2px 2px 2px 12px;border-radius:var(--r-s);border:1px solid var(--line);font-size:13.5px}
.receipt>.ic{color:var(--ok);width:18px;height:18px}.receipt span{flex:1}
.approval{display:grid;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--warn)}
.approval header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.approval .chip{white-space:normal}
.diff{display:grid;gap:4px;font-size:14px}.diff .del{color:var(--danger)}
.approval .actions .btn{flex:1 1 auto}
.working{display:flex;align-items:center;gap:5px;font-size:13.5px;color:var(--muted)}
.working i{width:6px;height:6px;border-radius:50%;background:var(--accent-text)}.working span{margin-left:6px}
.dock{position:sticky;bottom:0;display:grid;gap:8px;padding:8px 0 12px;background:var(--bg);box-shadow:0 -14px 14px var(--bg)}
.toast{justify-self:center;padding:10px 16px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-weight:650;font-size:13.5px;box-shadow:var(--shadow)}
.quick{display:flex;gap:8px;overflow-x:auto}.quick .btn{border-radius:99px;white-space:nowrap}
.composer{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 8px;border-radius:calc(var(--r) + 6px);background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.composer textarea{border:0;background:transparent;resize:none;padding:11px 8px;min-width:0;flex:1}
.composer-actions{display:flex}
.icon-btn.send{background:var(--accent);color:var(--on-accent);border-radius:50%}

/* calendar */
.cal-bar{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.cal-title{flex:1;display:grid;text-align:center;line-height:1.2}.cal-title b{font-family:var(--font-d);font-size:16px}.cal-title span{font-size:12.5px;color:var(--muted)}
.datef input{text-align:center;font-weight:650}
.cal-grid,.cal-col,.agenda{display:grid;gap:12px;align-content:start}
.pane{display:none}
.week-sum .count{font-size:13.5px;color:var(--muted)}
.day{display:grid;grid-template-columns:40px 1fr;gap:10px}
.day-h{display:grid;justify-items:center;align-content:start;gap:1px;padding-top:6px;font-size:12px;color:var(--muted)}
.day-h b{font-weight:650;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.dnum{font-family:var(--font-n);font-size:19px;font-weight:650;color:var(--ink);width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.is-today .dnum{background:var(--accent);color:var(--on-accent)}
.day-h em{font-style:normal;font-weight:700;font-size:10.5px;color:var(--accent-text)}
.day-b{display:grid;gap:8px;min-width:0;align-content:start}
.wx{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}.flag{font-weight:600}
.note{font-size:14px;padding:10px 12px;border-radius:var(--r-s);background:var(--surface-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
[data-sport=run]{--sp:var(--run);--sp-soft:var(--run-soft)}[data-sport=ride]{--sp:var(--ride);--sp-soft:var(--ride-soft)}[data-sport=strength]{--sp:var(--strength);--sp-soft:var(--strength-soft)}
.unit{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sp);border-radius:var(--r-s);min-width:0}
.unit>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;padding:12px;min-height:60px}
.u-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sp-soft);color:var(--sp)}.u-ic .ic{width:19px;height:19px}
.u-main{display:grid;min-width:0}.u-main b{font-weight:650;font-size:15px}.u-main small{font-size:12.5px;color:var(--muted)}
.u-num{display:grid;justify-items:end;font-family:var(--font-n)}.u-num b{font-size:16px;font-weight:650}.u-num small{font-size:12.5px;color:var(--muted)}
.unit .tags,.unit summary .profile{grid-column:1/-1}
.unit summary .profile svg{height:26px}
.unit.is-planned,.unit.is-today{border-style:dashed;border-left-style:solid}
.unit.is-missed{border-left-color:var(--danger)}.unit.is-missed .u-main b{text-decoration:line-through;text-decoration-color:var(--danger)}
.unit.is-selected{border-color:var(--sp);border-style:solid}
.unit-body{display:grid;gap:14px;padding:4px 12px 14px}
.unit-body>.profile svg{height:84px}
.load b{font-family:var(--font-n);font-size:20px}
.chipbtn{border-style:dashed;border-radius:99px}
.desc{font-size:14.5px}
.planline{font-size:13.5px;color:var(--muted)}
.unit-body .tbl{font-size:13px}
.cal-foot{display:grid;gap:8px;padding:4px 0}
.month{padding:10px}
.month table{width:100%;border-collapse:collapse;table-layout:fixed}
.month thead th{font-size:11.5px;color:var(--muted);font-weight:650;padding:4px 0}
.month td{padding:1px;text-align:center}
.month td button{width:100%;min-height:46px;border:0;background:none;border-radius:var(--r-s);display:grid;justify-items:center;align-content:center;gap:4px;font-family:var(--font-n);font-weight:600;font-size:14px;cursor:pointer}
.month td.out button{color:var(--muted)}
.month tr.cur td button{background:var(--surface-2);border-radius:0}
.month td.is-today button span{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 7px}
.month tbody th{font-size:11px;color:var(--muted);font-weight:650;line-height:1.25}.month tbody th small{display:block;font-weight:500;font-family:var(--font-n)}
.mark{width:8px;height:8px;border-radius:50%;background:var(--sp);display:block}
.mark.is-planned,.mark.is-today{background:transparent;box-shadow:inset 0 0 0 2px var(--sp)}
.mark.is-missed{background:transparent;box-shadow:inset 0 0 0 2px var(--danger);border-radius:2px}

/* nutrition */
.meal header,.prod header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-6px -8px -6px 0}
.meal,.prod{gap:6px}.vals{font-family:var(--font-n);font-weight:600;font-size:14px}
.star.on{color:var(--warn)}.star.on .ic{fill:currentColor}
.prod .actions{margin-top:6px}

/* more */
.more-grid,.more-body{display:grid;gap:14px;align-content:start}
.more-nav{flex-wrap:wrap}.more-nav a{flex:1 1 30%}

/* desktop */
@container app (min-width:900px){
  .shell{flex-direction:row}
  .nav{order:0;width:216px;height:auto;grid-template-columns:1fr;align-content:start;gap:4px;padding:20px 12px;border-top:0;border-right:1px solid var(--line)}
  .nav-item{flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;min-height:48px;font-size:15px;border-radius:var(--r-btn)}
  .page{padding:28px 36px 40px;gap:20px}
  .app h1{font-size:30px}
  .tabs{justify-self:start}.tabs a{flex:0 0 auto;padding:0 18px}
  .grid2{grid-template-columns:1fr 1fr}
  .tiles.facts{grid-template-columns:repeat(4,1fr)}
  .tiles.nut{grid-template-columns:2fr repeat(5,1fr)}.tiles.nut .hero{grid-column:auto}
  .cal-grid{grid-template-columns:440px 1fr;gap:24px}
  .cal-bar{max-width:440px}
  .pane{display:grid;gap:14px;align-content:start;position:sticky;top:0;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--sp);border-radius:var(--r);padding:20px}
  .pane-h{display:grid;gap:4px;justify-items:start}.pane-h p{font-size:13.5px;color:var(--muted)}
  .pane .unit-body{padding:0}.pane .tiles.facts{grid-template-columns:repeat(4,1fr)}
  .unit>.unit-body{display:none}
  .more-grid{grid-template-columns:220px 1fr;gap:28px}
  .more-nav{flex-direction:column;position:sticky;top:0}.more-nav a{justify-content:start;place-items:center start;flex:none}
  .page.coach{padding-top:20px}
}

  /* ---------- Login ---------- */
  const login = () => `<div class="login"><form class="login-card"><p class="brand">Pacecraft · AI Coach</p><h1>Anmelden</h1>

    <button type="button" class="btn primary block">Anmelden</button></form></div>`;

  /* ---------- Coach ---------- */
  const coach = () => `<div class="page coach">
    <section class="strip" data-level="info"><i class="dot"></i><b>Schwellenwerte prüfen</b><span>Stand vor 4 min</span><a href="#">Prüfen</a><button class="icon-btn" aria-label="Für diese Sitzung ausblenden">${ic('close')}</button></section>

      <button class="btn ghost load-more">Weitere Nachrichten laden</button>

</script><script>
const DIRS=[["a","A · Feinschliff"]], state={screen:'kal-woche',device:'phone',theme:'both',full:''};
const stage=document.querySelector('.mv-stage'), sel=document.querySelector('#mvScreen');
sel.innerHTML=MOCK.list.map(s=>'<option value="'+s.key+'">'+s.title+'</option>').join('');
function render(){
  sel.value=state.screen;
  const themes=state.theme==='both'?['light','dark']:[state.theme];
  const W=state.device==='phone'?412:1280,H=state.device==='phone'?880:820;
  const frames=[];DIRS.forEach(d=>themes.forEach(t=>frames.push([d,t])));
  const perRow=state.device==='phone'?frames.length:1,avail=stage.clientWidth||712;
  const z=Math.min(1,(avail-14*(perRow-1))/(perRow*W));
  stage.innerHTML=frames.map(([d,t])=>'<figure class="mv-frame dir-'+d[0]+'"><figcaption>'+d[1]+' · '+(t==='light'?'Hell':'Dunkel')+'</figcaption><div class="mv-clip" style="width:'+Math.floor(W*z)+'px;height:'+Math.floor(H*z)+'px"><div class="app'+(state.full?' full':'')+'" data-theme="'+t+'" style="width:'+W+'px;height:'+H+'px;min-height:'+H+'px;transform:scale('+z+')">'+MOCK.shell(state.screen)+'</div></div></figure>').join('');
  stage.querySelectorAll('.mv-clip').forEach(c=>{const a=c.firstChild;c.style.height=Math.floor(a.offsetHeight*z)+'px';const m=a.querySelector('.main');if(m&&a.querySelector('.coach'))m.scrollTop=m.scrollHeight});
  document.querySelectorAll('[data-set]').forEach(b=>{const [k,v]=b.dataset.set.split(':');b.setAttribute('aria-pressed',state[k]===v)});
}
document.querySelector('.mv-bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.set){const [k,v]=b.dataset.set.split(':');state[k]=v}
  if(b.dataset.step){const i=MOCK.list.findIndex(s=>s.key===state.screen),n=MOCK.list.length;state.screen=MOCK.list[(i+ +b.dataset.step+n)%n].key}
  render()});
sel.addEventListener('change',()=>{state.screen=sel.value;render()});
stage.addEventListener('click',e=>{if(e.target.closest('a,summary'))e.preventDefault()});
const q=new URLSearchParams(location.hash.slice(1));['screen','device','theme','full'].forEach(k=>{if(q.get(k))state[k]=q.get(k)});
addEventListener('resize',render);render();</script></body></html>
