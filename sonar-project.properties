sonar.python.version=3.13,3.14
sonar.sources=.
sonar.exclusions=tests/**,e2e/**
sonar.tests=tests,e2e
# dataclasses.replace() on frozen dataclasses: Sonar cannot infer the return
# type and reports S5886/S5890 "DataclassInstance" although mypy types it
# correctly. Exempted for backend code only (see backend/AGENTS.md).
sonar.issue.ignore.multicriteria=replaceReturn1,replaceReturn2
sonar.issue.ignore.multicriteria.replaceReturn1.ruleKey=python:S5886
sonar.issue.ignore.multicriteria.replaceReturn1.resourceKey=backend/**/*.py
sonar.issue.ignore.multicriteria.replaceReturn2.ruleKey=python:S5890
sonar.issue.ignore.multicriteria.replaceReturn2.resourceKey=backend/**/*.py
