version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    cooldown:
      default-days: 3
    schedule:
      interval: daily
    commit-message:
      prefix: build
    # A local agent tool; its pin and hash are raised by hand (#2633).
    ignore:
      - dependency-name: modern-web-guidance
  - package-ecosystem: pip
    directory: "/"
    target-branch: develop
    commit-message:
      prefix: build
    cooldown:
      default-days: 3
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # A Linux lock drops the Graphify lock's Windows-only pins; bump its direct
    # requirements by hand on Windows when prepare_worktree.py reports a newer
    # version (#2554).
    ignore:
      - dependency-name: graphifyy
      - dependency-name: pywin32
  - package-ecosystem: docker
    directory: "/"
    target-branch: develop
    commit-message:
      prefix: build
    cooldown:
      default-days: 3
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    commit-message:
      prefix: ci
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
