version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    cooldown:
      default-days: 3
    schedule:
      interval: daily
    commit-message:
      prefix: build
  - package-ecosystem: pip
    directory: "/"
    target-branch: develop
    commit-message:
      prefix: build
    cooldown:
      default-days: 3
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: docker
    directory: "/"
    target-branch: develop
    commit-message:
      prefix: build
    cooldown:
      default-days: 3
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    commit-message:
      prefix: ci
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
