name: Codex review gate
description: Wait for the native Codex result for the current pull-request commit

inputs:
  github-token:
    description: GitHub token used to read reviews and update the check run
    required: true
  pull-request-number:
    description: Pull request number to monitor
    required: true
  check-name:
    description: Required GitHub check name
    required: true
    default: Codex code review
  codex-bot-logins:
    description: Comma-separated GitHub login names accepted as the Codex reviewer
    required: true
    default: chatgpt-codex-connector[bot],chatgpt-codex-connector
  timeout-seconds:
    description: Maximum time to wait for a completed Codex result
    required: true
    default: '2400'
  poll-seconds:
    description: Seconds between review status polls
    required: true
    default: '30'
  review-requested-at:
    description: ISO timestamp after which this invocation must observe review artifacts
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Poll Codex review and enforce findings
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
        CHECK_NAME: ${{ inputs.check-name }}
        CODEX_BOT_LOGINS: ${{ inputs.codex-bot-logins }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        POLL_SECONDS: ${{ inputs.poll-seconds }}
        REVIEW_REQUESTED_AT: ${{ inputs.review-requested-at }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const {
            commitMatchesHead,
            isAtOrAfterTimestamp,
            parseCodeReviewSummary,
          } = require(`${process.env.ACTION_PATH}/summary.cjs`);
          const prNumber = Number(process.env.PR_NUMBER);
          const checkName = process.env.CHECK_NAME;
          const botLogins = new Set(
            process.env.CODEX_BOT_LOGINS
              .split(',')
              .map((login) => login.trim())
              .filter(Boolean),
          );
          const timeoutSeconds = Number(process.env.TIMEOUT_SECONDS);
          const pollSeconds = Number(process.env.POLL_SECONDS);

          if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
            core.setFailed('The pull request number is invalid.');
            return;
          }
          if (!checkName || botLogins.size === 0) {
            core.setFailed('The Codex review gate is missing its configuration.');
            return;
          }
          if (!Number.isFinite(timeoutSeconds) || timeoutSeconds < 1) {
            core.setFailed('The Codex review timeout is invalid.');
            return;
          }
          if (!Number.isFinite(pollSeconds) || pollSeconds < 1) {
            core.setFailed('The Codex review poll interval is invalid.');
            return;
          }
          const requestedAtInput = process.env.REVIEW_REQUESTED_AT;
          const minimumArtifactTime = requestedAtInput
            ? Date.parse(requestedAtInput)
            : context.eventName === 'issue_comment'
              ? Date.parse(context.payload.comment?.created_at || '')
              : 0;
          if (!Number.isFinite(minimumArtifactTime)) {
            core.setFailed('The Codex review request timestamp is invalid.');
            return;
          }

          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const codexSummaryMarker = '<!-- codex-pull-request-review-summary -->';
          const sleep = (seconds) => new Promise((resolve) => setTimeout(resolve, seconds * 1000));

          const reviewedCommitCache = new Map();
          const commitBelongsToHead = async (reviewedCommit, headSha) => {
            if (!reviewedCommit) {
              return false;
            }
            if (commitMatchesHead(reviewedCommit, headSha)) {
              return true;
            }
            if (!/^[0-9a-f]{7,40}$/i.test(reviewedCommit)) {
              return false;
            }
            const cacheKey = `${reviewedCommit}:${headSha}`;
            if (!reviewedCommitCache.has(cacheKey)) {
              reviewedCommitCache.set(cacheKey, (async () => {
                try {
                  const response = await github.rest.repos.compareCommits({
                    owner,
                    repo,
                    base: reviewedCommit,
                    head: headSha,
                  });
                  return ['ahead', 'identical'].includes(response.data.status);
                } catch (error) {
                  core.debug(`Ignoring unrelated Codex commit reference: ${error}`);
                  return false;
                }
              })());
            }
            return reviewedCommitCache.get(cacheKey);
          };

          const getPullRequest = async () => {
            const response = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            return response.data;
          };

          const getCodexReviews = async (headSha, minimumSubmittedAt) => {
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const candidates = reviews.filter((review) => (
              botLogins.has(review.user?.login) &&
              (minimumSubmittedAt === 0 || (
                review.submitted_at &&
                Date.parse(review.submitted_at) >= minimumSubmittedAt
              ))
            ));
            const matches = await Promise.all(candidates.map(async (review) => (
              await commitBelongsToHead(review.commit_id, headSha) ? review : null
            )));
            return matches.filter(Boolean);
          };

          const getCodexSummary = async (headSha, minimumUpdatedAt) => {
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const summaries = comments
              .filter((comment) => (
                botLogins.has(comment.user?.login) &&
                (comment.body || '').includes(codexSummaryMarker)
              ))
              .map((comment) => ({
                comment,
                codeReview: parseCodeReviewSummary(comment.body),
                updatedAt: Date.parse(comment.updated_at || comment.created_at || ''),
              }))
              .sort((left, right) => (
                new Date(right.comment.updated_at).getTime() -
                new Date(left.comment.updated_at).getTime()
              ));

            let current;
            for (const summary of summaries) {
              if (summary.updatedAt < minimumUpdatedAt || !summary.codeReview?.commit) {
                continue;
              }
              if (await commitBelongsToHead(summary.codeReview.commit, headSha)) {
                current = summary;
                break;
              }
            }

            return { current, latest: summaries[0] };
          };

          const getCleanReactions = async (minimumCreatedAt) => {
            if (!Number.isFinite(minimumCreatedAt)) {
              return [];
            }
            const reactions = await github.paginate(github.rest.reactions.listForIssue, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            return reactions.filter((reaction) => (
              botLogins.has(reaction.user?.login) &&
              reaction.content === '+1' &&
              isAtOrAfterTimestamp(reaction.created_at, minimumCreatedAt)
            ));
          };

          const getReviewComments = async (reviewId) => {
            const comments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            return comments.filter((comment) => (
              comment.pull_request_review_id === reviewId &&
              botLogins.has(comment.user?.login)
            ));
          };

          const getUnresolvedCodexReviewIds = async () => {
            const unresolvedReviewIds = new Set();
            let cursor = null;
            do {
              const response = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        nodes {
                          isResolved
                          comments(first: 1) {
                            nodes {
                              author { login }
                              pullRequestReview { databaseId }
                            }
                          }
                        }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }
              `, { owner, repo, number: prNumber, cursor });
              const threads = response.repository.pullRequest.reviewThreads;
              for (const thread of threads.nodes) {
                const comment = thread.comments.nodes[0];
                if (!thread.isResolved && botLogins.has(comment?.author?.login)) {
                  unresolvedReviewIds.add(comment.pullRequestReview?.databaseId);
                }
              }
              cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
            } while (cursor);
            return unresolvedReviewIds;
          };

          const updateCheck = async (checkRunId, status, conclusion, title, summary) => {
            const params = {
              owner,
              repo,
              check_run_id: checkRunId,
              status,
              output: { title, summary },
            };
            if (status === 'completed') {
              params.conclusion = conclusion;
              params.completed_at = new Date().toISOString();
            }
            await github.rest.checks.update(params);
          };

          const createOrResumeCheck = async (headSha) => {
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: headSha,
              per_page: 100,
            });
            const matchingRuns = checkRuns
              .filter((run) => run.name === checkName)
              .sort((left, right) => right.id - left.id);
            const resumableRun = matchingRuns.find((run) => run.status !== 'completed');

            if (resumableRun) {
              await updateCheck(
                resumableRun.id,
                'in_progress',
                undefined,
                'Waiting for Codex review',
                `Waiting for the subscription-backed Codex review for commit ${headSha}.`,
              );
              return resumableRun.id;
            }

            const response = await github.rest.checks.create({
              owner,
              repo,
              name: checkName,
              head_sha: headSha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              output: {
                title: 'Waiting for Codex review',
                summary: `Waiting for the subscription-backed Codex review for commit ${headSha}.`,
              },
            });
            return response.data.id;
          };

          let checkRunId;
          try {
            const initialPullRequest = await getPullRequest();
            const headSha = initialPullRequest.head.sha;
            const baseSha = initialPullRequest.base.sha;
            checkRunId = await createOrResumeCheck(headSha);
            const deadline = Date.now() + timeoutSeconds * 1000;
            let currentPollSeconds = pollSeconds;
            let previousObservation;

            core.info(`Waiting for Codex to publish a review for ${headSha} against base ${baseSha}.`);
            while (Date.now() < deadline) {
              const currentPullRequest = await getPullRequest();
              if (currentPullRequest.state !== 'open') {
                await updateCheck(
                  checkRunId,
                  'completed',
                  'cancelled',
                  'Codex review cancelled',
                  `The pull request is ${currentPullRequest.merged ? 'merged' : 'closed'}; no review gate is required.`,
                );
                core.info('The pull request is no longer open; stopping the review gate.');
                return;
              }
              if (currentPullRequest.head.sha !== headSha || currentPullRequest.base.sha !== baseSha) {
                throw new Error(
                  `The pull request revision changed while waiting; the gate run for ${headSha} against ` +
                  `base ${baseSha} is stale.`,
                );
              }

              const summary = await getCodexSummary(headSha, minimumArtifactTime);
              const summaryStatus = String(summary.current?.codeReview?.status || '').toLowerCase();
              const reviews = await getCodexReviews(headSha, minimumArtifactTime);
              const pendingReviews = reviews.filter((review) => (
                review.state === 'PENDING' || !review.submitted_at
              ));
              const completedReviews = reviews
                .filter((review) => (
                  review.submitted_at &&
                  ['COMMENTED', 'APPROVED', 'CHANGES_REQUESTED'].includes(review.state)
                ))
                .sort((left, right) => (
                  new Date(right.submitted_at).getTime() - new Date(left.submitted_at).getTime()
                ));
              const cleanReactions = summaryStatus === 'completed'
                ? await getCleanReactions(Math.max(
                  minimumArtifactTime,
                  summary.current.codeReview.completedAt,
                ))
                : [];
              const observation = JSON.stringify({
                summary: summary.current
                  ? {
                    id: summary.current.comment.id,
                    updatedAt: summary.current.updatedAt,
                    status: summaryStatus,
                    commit: summary.current.codeReview.commit,
                  }
                  : summary.latest?.comment.updated_at || null,
                reviews: reviews
                  .map((review) => ({
                    id: review.id,
                    state: review.state,
                    submittedAt: review.submitted_at,
                  }))
                  .sort((left, right) => left.id - right.id),
                cleanReactions: cleanReactions
                  .map((reaction) => ({
                    id: reaction.id,
                    createdAt: reaction.created_at,
                  }))
                  .sort((left, right) => left.id - right.id),
              });
              currentPollSeconds = observation === previousObservation
                ? Math.min(currentPollSeconds * 2, 120)
                : pollSeconds;
              previousObservation = observation;

              if (summaryStatus === 'completed') {
                if (completedReviews.length > 0) {
                  const review = completedReviews[0];
                  const comments = await getReviewComments(review.id);
                  const unresolvedReviewIds = await getUnresolvedCodexReviewIds();
                  const carriedForward = review.commit_id !== headSha;
                  const bodyPriorityFindings = (review.body || '').match(/\[P[0-3]\]/gi) || [];
                  const findingCount = carriedForward && comments.length > 0 && !unresolvedReviewIds.has(review.id)
                    ? 0
                    : comments.length + (comments.length === 0 ? bodyPriorityFindings.length : 0);

                  if (review.state === 'CHANGES_REQUESTED' || findingCount > 0) {
                    const resultSummary = findingCount > 0
                      ? `Codex published ${findingCount} actionable finding(s) for commit ${headSha}.`
                      : `Codex requested changes for commit ${headSha}.`;
                    await updateCheck(
                      checkRunId,
                      'completed',
                      'failure',
                      'Codex found actionable findings',
                      `${resultSummary} See the Codex review comments on the pull request.`,
                    );
                    core.setFailed(resultSummary);
                    return;
                  }

                  await updateCheck(
                    checkRunId,
                    'completed',
                    'success',
                    'Codex review completed cleanly',
                    `Codex completed its review for commit ${headSha} without actionable findings.`,
                  );
                  core.info(`Codex review ${review.id} completed without actionable findings.`);
                  return;
                }

                if (cleanReactions.length > 0) {
                  await updateCheck(
                    checkRunId,
                    'completed',
                    'success',
                    'Codex review completed cleanly',
                    `Codex completed its review for commit ${headSha} and marked it free of findings.`,
                  );
                  core.info(`Codex completed without findings; clean reaction ${cleanReactions[0].id} observed.`);
                  return;
                }
              }

              if (summary.current && summaryStatus !== 'completed') {
                core.info(
                  `Codex summary comment ${summary.current.comment.id} reports status ` +
                  `${summaryStatus || 'in progress'}; continuing to wait.`,
                );
              } else if (summaryStatus === 'completed') {
                core.info('Codex marked its summary complete; waiting for a submitted review or clean reaction.');
              } else if (completedReviews.length > 0 || pendingReviews.length > 0) {
                core.info('Codex review activity exists, but its current-head summary is not complete yet.');
              } else if (summary.latest) {
                core.info('The Codex summary belongs to an older commit; waiting for the current head.');
              } else {
                core.info('Codex has not posted its review summary yet; continuing to wait.');
              }
              core.debug(`No completed Codex result yet; polling again in ${currentPollSeconds} seconds.`);
              await sleep(currentPollSeconds);
            }

            throw new Error(`Timed out after ${timeoutSeconds} seconds waiting for Codex to publish its review.`);
          } catch (error) {
            const message = error instanceof Error ? error.message : String(error);
            if (checkRunId) {
              try {
                await updateCheck(
                  checkRunId,
                  'completed',
                  'failure',
                  'Codex review gate failed',
                  `${message} The gate fails closed; wait for a fresh run for the current commit.`,
                );
              } catch (updateError) {
                core.warning(`Could not update the Codex check run: ${updateError}`);
              }
            }
            core.setFailed(message);
          }
