name: Validate repository AI documentation

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  ai-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_DOCS_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Require project guidance and its validator
        run: |
          test -f AGENTS.md
          test -f REVIEW.md
          test -f .agents/skills/README.md
          test -f tests/test_ai_docs_contract.py
      - name: Validate guidance, discovery, and local references
        run: python -m unittest discover -s tests -p test_ai_docs_contract.py -v
