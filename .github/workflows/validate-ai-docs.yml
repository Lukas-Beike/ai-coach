name: Validate repository AI documentation

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  ai-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_DOCS_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require project guidance and its validator
        run: |
          test -f AGENTS.md
          test -f REVIEW.md
          test -f .agents/skills/README.md
          test -f tests/test_ai_docs_contract.py
      - name: Validate guidance, discovery, and local references
        run: python -m unittest discover -s tests -p test_ai_docs_contract.py -v
      - name: Validate native review availability policy
        run: node --test tests/codex-review-watchdog.test.cjs
