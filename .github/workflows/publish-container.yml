name: Test and publish container image

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish
        required: true
        type: string
      source_ref:
        description: Optional branch or commit to check out instead of release_tag
        required: false
        type: string
      publish_container:
        description: Publish the container after tests pass
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test_shards:
    name: Test shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref || github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Verify release and application versions match
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -nE 's/^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' server.py)"
          if [[ -z "$app_version" ]]; then
            echo "Could not read APP_VERSION from server.py."
            exit 1
          fi
          if [[ "$app_version" != "$EXPECTED_RELEASE_TAG" ]]; then
            echo "Release tag $EXPECTED_RELEASE_TAG does not match APP_VERSION $app_version."
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python tests/run_tests.py --shard "${{ matrix.shard }}" --total 4

  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run syntax checks
        run: python -m py_compile server.py tests/test_server.py tests/run_tests.py

  test:
    if: always()
    needs: [test_shards, syntax]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate test and syntax results
        env:
          TEST_SHARDS_RESULT: ${{ needs.test_shards.result }}
          SYNTAX_RESULT: ${{ needs.syntax.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TEST_SHARDS_RESULT" != "success" || "$SYNTAX_RESULT" != "success" ]]; then
            echo "Test shards: $TEST_SHARDS_RESULT; syntax: $SYNTAX_RESULT"
            exit 1
          fi
          echo "All test shards and syntax checks passed."

  e2e:
    if: needs.test.result == 'success'
    needs: test
    name: Browser smoke and accessibility checks
    runs-on: ubuntu-latest
    env:
      # This is an isolated fixture credential, never a repository or provider secret.
      E2E_APP_PASSWORD: e2e-fixture-password-1234
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build isolated application image
        run: docker build --tag ai-coach:e2e .
      - name: Start isolated fixture application
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name ai-coach-e2e --publish 8090:8090 \
            --read-only --security-opt no-new-privileges:true \
            --env APP_PASSWORD="$E2E_APP_PASSWORD" --env COOKIE_SECURE=false \
            ai-coach:e2e >/dev/null
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8090/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The isolated fixture application did not become healthy."
          exit 1
      - name: Run browser smoke and accessibility checks
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove isolated fixture application
        if: always()
        run: docker rm --force ai-coach-e2e >/dev/null 2>&1 || true

  build-and-push:
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && inputs.publish_container == true)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release_tag || github.ref }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}
            type=sha,format=long
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
