name: Test and publish container image

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish
        required: true
        type: string
      publish_container:
        description: Publish the container after tests pass
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  source:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_container != true || github.ref == 'refs/heads/main'
    name: Resolve immutable source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release validation must come from protected main, never the requested tag.
          ref: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_container == true)) && 'refs/heads/main' || github.sha }}
          fetch-depth: 0
      - name: Resolve source and release contract
        id: source
        env:
          # Execute only this workflow event's commit, never a dispatched source override.
          SOURCE_REF: ${{ github.sha }}
          # Release PRs are tested before their tag exists, with read-only permissions.
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && inputs.publish_container == true) && inputs.release_tag || '' }}
          EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: python .github/scripts/release_source.py

  test_shards:
    needs: source
    name: Test shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install "--only-binary=:all:" --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: coverage run tests/run_tests.py --shard "${{ matrix.shard }}" --total 4
      - name: Upload shard coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage-${{ matrix.shard }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  syntax:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Run syntax checks
        run: python -m compileall -q server.py backend tests

  container_tests:
    needs: source
    name: Container unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Build isolated SQLCipher test image
        run: docker build --tag ai-coach:test .
      - name: Run unit tests in the container
        run: >-
          docker run --rm --read-only --security-opt no-new-privileges:true --cap-drop=ALL
          --pids-limit=256 --memory=512m --cpus=1 --tmpfs /tmp
          --volume "${GITHUB_WORKSPACE}/tests:/review/tests:ro"
          --volume "${GITHUB_WORKSPACE}/Dockerfile:/review/Dockerfile:ro"
          --volume "${GITHUB_WORKSPACE}/requirements.in:/review/requirements.in:ro"
          --volume "${GITHUB_WORKSPACE}/requirements.txt:/review/requirements.txt:ro"
          --volume "${GITHUB_WORKSPACE}/requirements-dev.in:/review/requirements-dev.in:ro"
          --volume "${GITHUB_WORKSPACE}/requirements-dev.txt:/review/requirements-dev.txt:ro"
          --volume "${GITHUB_WORKSPACE}/pyproject.toml:/review/pyproject.toml:ro"
          --volume "${GITHUB_WORKSPACE}/tools:/review/tools:ro"
          --volume "${GITHUB_WORKSPACE}/tools:/app/tools:ro"
          --volume "${GITHUB_WORKSPACE}/docs:/review/docs:ro"
          --volume "${GITHUB_WORKSPACE}/public:/review/public:ro"
          --volume "${GITHUB_WORKSPACE}/server.py:/review/server.py:ro"
          --volume "${GITHUB_WORKSPACE}/playwright.config.cjs:/review/playwright.config.cjs:ro"
          --volume "${GITHUB_WORKSPACE}/e2e:/app/e2e:ro"
          --volume "${GITHUB_WORKSPACE}/e2e:/review/e2e:ro"
          --volume "${GITHUB_WORKSPACE}/.github:/review/.github:ro"
          --env PYTHONPATH=/app:/review/tests --workdir /app ai-coach:test
          python /review/tests/run_tests.py

  test:
    if: always()
    needs: [test_shards, syntax, container_tests, image_sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate test and syntax results
        env:
          TEST_SHARDS_RESULT: ${{ needs.test_shards.result }}
          SYNTAX_RESULT: ${{ needs.syntax.result }}
          CONTAINER_TESTS_RESULT: ${{ needs.container_tests.result }}
          IMAGE_SBOM_RESULT: ${{ needs.image_sbom.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TEST_SHARDS_RESULT" != "success" || "$SYNTAX_RESULT" != "success" || "$CONTAINER_TESTS_RESULT" != "success" || "$IMAGE_SBOM_RESULT" != "success" ]]; then
            echo "Test shards: $TEST_SHARDS_RESULT; syntax: $SYNTAX_RESULT; container tests: $CONTAINER_TESTS_RESULT; image SBOM: $IMAGE_SBOM_RESULT"
            exit 1
          fi
          echo "All native shards, syntax checks, and container tests passed."

  quality:
    name: Incremental quality checks
    needs: [source, test]
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install application and quality dependencies
        run: python -m pip install "--only-binary=:all:" --require-hashes -r requirements-dev.txt
      - name: Download shard coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Enforce merged coverage ratchet
        run: |
          set -euo pipefail
          if [[ "$(find coverage-data -name '.coverage.*' -type f | wc -l)" -ne 4 ]]; then
            echo "Expected coverage data from all four test shards."
            exit 1
          fi
          coverage combine coverage-data
          coverage report
      - name: Enforce repository quality ratchet
        run: python tools/quality_baseline.py

  image_sbom:
    needs: source
    name: Image SBOM
    runs-on: ubuntu-latest
    permissions:
      # Keep the security job read-only; the SBOM is stored as a workflow artifact.
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Build isolated image for scanning
        run: docker build --tag ai-coach:security .
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ai-coach:security
          format: spdx-json
          output-file: ai-coach-sbom.spdx.json
          upload-release-assets: false
      - name: Upload image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-coach-sbom
          path: ai-coach-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
  e2e:
    if: needs.test.result == 'success'
    needs: [source, test]
    name: Browser checks (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-small, mobile, tablet, tablet-landscape, desktop]
    env:
      # This is an isolated fixture credential, never a repository or provider secret.
      E2E_APP_PASSWORD: e2e-fixture-password-1234
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Run Node unit tests
        if: matrix.project == 'desktop'
        run: node --test tests/*.cjs
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install chromium
      - name: Install Chromium system dependencies
        run: ./node_modules/.bin/playwright install-deps chromium
      - name: Build isolated application image
        run: docker build --tag ai-coach:e2e .
      - name: Run browser smoke and accessibility checks
        shell: bash
        run: |
          set -euo pipefail
          project="${{ matrix.project }}"
          specs=(e2e/*.spec.js)
          cleanup() {
            result=$?
            if [[ "$result" != "0" ]]; then
              docker inspect --format 'fixture state={{.State.Status}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' ai-coach-e2e >&2 || true
              docker logs ai-coach-e2e >&2 || true
            fi
            docker rm --force ai-coach-e2e >/dev/null 2>&1 || true
            return "$result"
          }
          trap cleanup EXIT
          for spec in "${specs[@]}"; do
            # Desktop covers all contracts. Other jobs run only responsive files.
            if [[ "$project" != "desktop" ]] && ! grep -q '@responsive' "$spec"; then
              continue
            fi
            cleanup
            docker run --detach --name ai-coach-e2e --publish 127.0.0.1:8090:8090 \
              --read-only --security-opt no-new-privileges:true --cap-drop=ALL \
              --pids-limit=256 --memory=1g --cpus=2 --tmpfs /data:uid=100,gid=101,mode=0700 --tmpfs /tmp \
              --env APP_PASSWORD="$E2E_APP_PASSWORD" --env COOKIE_SECURE=false \
              --volume "${GITHUB_WORKSPACE}/e2e:/app/e2e:ro" \
              ai-coach:e2e python /app/e2e/fixture_runtime.py >/dev/null
            for attempt in {1..90}; do
              if curl --fail --silent http://127.0.0.1:8090/api/health >/dev/null && \
                curl --fail --silent http://127.0.0.1:8090/ >/dev/null; then
                break
              fi
              if [[ "$attempt" == "90" ]]; then
                echo "The isolated fixture application did not become healthy for $project ($spec)."
                exit 1
              fi
              sleep 0.5
            done
            spec_name="$(basename "$spec" .spec.js)"
            PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$spec_name" \
              npm run test:e2e -- "$spec" --project "$project" --output "test-results/$spec_name"
          done
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-artifacts-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove isolated fixture application
        if: always()
        run: docker rm --force ai-coach-e2e >/dev/null 2>&1 || true

  browser:
    if: always()
    needs: e2e
    name: Browser checks
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate browser results
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$E2E_RESULT" != "success" ]]; then
            echo "Browser checks: $E2E_RESULT"
            exit 1
          fi
          echo "All browser projects passed."

  build-and-push:
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_container == true)
    needs: [source, test, e2e, browser, quality]
    runs-on: ubuntu-latest
    concurrency:
      group: container-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify build uses tested source and release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          TESTED_SHA: ${{ needs.source.outputs.source_sha }}
        run: python .github/scripts/release_source.py --verify "$TESTED_SHA"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}
            type=sha,format=long
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Build and push image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign published image digest
        env:
          COSIGN_YES: "true"
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          cosign sign "${image,,}@${{ steps.image.outputs.digest }}"
      - name: Verify image signature
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          SIGNING_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: >-
          cosign verify "${IMAGE,,}@${EXPECTED_DIGEST}"
          --certificate-identity "$SIGNING_IDENTITY"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Promote signed image and verify published tag digest parity
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          latest_release="$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$RELEASE_TAG" != "$latest_release" ]]; then
            echo "Refusing to replace latest with $RELEASE_TAG; current release is $latest_release."
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false --tag "$image:latest" "$image@$EXPECTED_DIGEST"
          for tag in "$RELEASE_TAG" latest; do
            actual_digest="$(docker buildx imagetools inspect "$image:$tag" | awk '/Digest:/ { print $2; exit }')"
            if [[ -z "$actual_digest" || "$actual_digest" != "$EXPECTED_DIGEST" ]]; then
              echo "Digest mismatch for $image:$tag: expected $EXPECTED_DIGEST, got ${actual_digest:-<missing>}"
              exit 1
            fi
          done
