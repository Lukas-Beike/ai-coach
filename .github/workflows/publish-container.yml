name: Test and publish container image

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish
        required: true
        type: string
      publish_container:
        description: Publish the container after tests pass
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Single source for the native unit-test shard count. The matrix below must
  # list 1..PYTHON_TEST_SHARDS literally because `env` is unavailable in `strategy`.
  PYTHON_TEST_SHARDS: '4'

jobs:
  source:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_container != true || github.ref == 'refs/heads/main'
    name: Resolve immutable source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release validation must come from protected main, never the requested tag.
          ref: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_container == true)) && 'refs/heads/main' || github.sha }}
          fetch-depth: 0
      - name: Resolve source and release contract
        id: source
        env:
          # Execute only this workflow event's commit, never a dispatched source override.
          SOURCE_REF: ${{ github.sha }}
          # Release PRs are tested before their tag exists, with read-only permissions.
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && inputs.publish_container == true) && inputs.release_tag || '' }}
          EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: python .github/scripts/release_source.py

  image:
    needs: source
    name: Build CI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Build shared CI image
        run: docker build --tag ai-coach:ci .
      - name: Export shared CI image
        run: docker save ai-coach:ci | gzip > ai-coach-ci-image.tar.gz
      - name: Upload shared CI image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-coach-ci-image
          path: ai-coach-ci-image.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test_shards:
    needs: source
    # Ruleset-required check names: keep the denominator equal to PYTHON_TEST_SHARDS.
    name: Test shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Fail on a missing AGENTS.md instead of silently skipping the AI docs contract.
      AI_DOCS_REQUIRED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install "--only-binary=:all:" --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: coverage run tests/run_tests.py --shard "${{ matrix.shard }}" --total "$PYTHON_TEST_SHARDS"
      - name: Upload shard coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-${{ matrix.shard }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  syntax:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Run syntax checks
        run: python -m compileall -q server.py backend tests

  container_tests:
    needs: [source, image]
    name: Container unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download shared CI image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-coach-ci-image
      - name: Load shared CI image
        run: gunzip -c ai-coach-ci-image.tar.gz | docker load
      - name: Run unit tests in the container
        run: >-
          docker run --rm --read-only --security-opt no-new-privileges:true --cap-drop=ALL
          --pids-limit=256 --memory=512m --cpus=1 --tmpfs /tmp
          --volume "${GITHUB_WORKSPACE}/tests:/review/tests:ro"
          --volume "${GITHUB_WORKSPACE}/Dockerfile:/review/Dockerfile:ro"
          --volume "${GITHUB_WORKSPACE}/requirements.in:/review/requirements.in:ro"
          --volume "${GITHUB_WORKSPACE}/requirements.txt:/review/requirements.txt:ro"
          --volume "${GITHUB_WORKSPACE}/requirements-dev.in:/review/requirements-dev.in:ro"
          --volume "${GITHUB_WORKSPACE}/requirements-dev.txt:/review/requirements-dev.txt:ro"
          --volume "${GITHUB_WORKSPACE}/pyproject.toml:/review/pyproject.toml:ro"
          --volume "${GITHUB_WORKSPACE}/README.md:/review/README.md:ro"
          --volume "${GITHUB_WORKSPACE}/tools:/review/tools:ro"
          --volume "${GITHUB_WORKSPACE}/tools:/app/tools:ro"
          --volume "${GITHUB_WORKSPACE}/docs:/review/docs:ro"
          --volume "${GITHUB_WORKSPACE}/public:/review/public:ro"
          --volume "${GITHUB_WORKSPACE}/server.py:/review/server.py:ro"
          --volume "${GITHUB_WORKSPACE}/playwright.config.cjs:/review/playwright.config.cjs:ro"
          --volume "${GITHUB_WORKSPACE}/e2e:/app/e2e:ro"
          --volume "${GITHUB_WORKSPACE}/e2e:/review/e2e:ro"
          --volume "${GITHUB_WORKSPACE}/.github:/review/.github:ro"
          --volume "${GITHUB_WORKSPACE}/scripts:/review/scripts:ro"
          --env PYTHONPATH=/app:/review/tests --workdir /app ai-coach:ci
          python /review/tests/run_tests.py --suite container

  test:
    if: always()
    needs: [test_shards, syntax, container_tests, image_sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate test and syntax results
        env:
          TEST_SHARDS_RESULT: ${{ needs.test_shards.result }}
          SYNTAX_RESULT: ${{ needs.syntax.result }}
          CONTAINER_TESTS_RESULT: ${{ needs.container_tests.result }}
          IMAGE_SBOM_RESULT: ${{ needs.image_sbom.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TEST_SHARDS_RESULT" != "success" || "$SYNTAX_RESULT" != "success" || "$CONTAINER_TESTS_RESULT" != "success" || "$IMAGE_SBOM_RESULT" != "success" ]]; then
            echo "Test shards: $TEST_SHARDS_RESULT; syntax: $SYNTAX_RESULT; container tests: $CONTAINER_TESTS_RESULT; image SBOM: $IMAGE_SBOM_RESULT"
            exit 1
          fi
          echo "All native shards, syntax checks, and container tests passed."

  quality:
    name: Incremental quality checks
    needs: [source, test]
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install application and quality dependencies
        run: python -m pip install "--only-binary=:all:" --require-hashes -r requirements-dev.txt
      - name: Download shard coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Keep each shard in its own directory so a missing shard is named.
          pattern: python-coverage-*
          path: coverage-data
      - name: Enforce merged coverage ratchet
        run: |
          set -euo pipefail
          combine_paths=()
          for shard in $(seq 1 "$PYTHON_TEST_SHARDS"); do
            directory="coverage-data/python-coverage-${shard}"
            count=0
            if [[ -d "$directory" ]]; then
              count="$(find "$directory" -name '.coverage.*' -type f | wc -l)"
            fi
            if [[ "$count" -ne 1 ]]; then
              echo "::error::Test shard ${shard} of ${PYTHON_TEST_SHARDS} produced ${count} coverage files in ${directory}; expected exactly one."
              exit 1
            fi
            combine_paths+=("$directory")
          done
          coverage combine "${combine_paths[@]}"
          coverage report
      - name: Enforce repository quality ratchet
        run: python tools/quality_baseline.py

  image_sbom:
    needs: [source, image]
    name: Image SBOM
    runs-on: ubuntu-latest
    permissions:
      # Keep the security job read-only; the SBOM is stored as a workflow artifact.
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download shared CI image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-coach-ci-image
      - name: Load shared CI image
        run: gunzip -c ai-coach-ci-image.tar.gz | docker load
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ai-coach:ci
          format: spdx-json
          output-file: ai-coach-sbom.spdx.json
          upload-release-assets: false
      - name: Upload image SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-coach-sbom
          path: ai-coach-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
  e2e:
    # Browser checks start as soon as the image exists, in parallel with the unit tests;
    # publishing still requires both the test and browser aggregates.
    needs: [source, image]
    name: Browser checks (${{ matrix.project }}${{ matrix.shards > 1 && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Desktop runs every functional contract, so its spec files are split round-robin.
        include:
          - { project: mobile-small, shard: 1, shards: 1 }
          - { project: mobile, shard: 1, shards: 1 }
          - { project: tablet, shard: 1, shards: 1 }
          - { project: tablet-landscape, shard: 1, shards: 1 }
          - { project: desktop, shard: 1, shards: 2 }
          - { project: desktop, shard: 2, shards: 2 }
    env:
      # This is an isolated fixture credential, never a repository or provider secret.
      E2E_APP_PASSWORD: e2e-fixture-password-1234
      SPEC_SHARD: ${{ matrix.shard }}
      SPEC_SHARDS: ${{ matrix.shards }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Run Node unit tests
        if: matrix.project == 'desktop' && matrix.shard == 1
        run: node --test tests/*.cjs
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install chromium
      - name: Install Chromium system dependencies
        run: ./node_modules/.bin/playwright install-deps chromium
      - name: Download shared CI image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-coach-ci-image
      - name: Load shared CI image
        run: gunzip -c ai-coach-ci-image.tar.gz | docker load
      - name: Run browser smoke and accessibility checks
        shell: bash
        run: |
          set -euo pipefail
          project="${{ matrix.project }}"
          prefix=ai-coach-e2e
          base_port=8090
          # Two fixture slots: spec i uses slot i % 2, so the next fixture can boot while this spec runs.
          container_name() { echo "$prefix-$(($1 % 2))"; }
          network_name() { echo "$prefix-net-$(($1 % 2))"; }
          container_port() { echo "$((base_port + $1 % 2))"; }
          # Playwright selects the files: desktop lists every file with tests, other projects
          # keep only the tests whose titles match their config grep (@responsive). A sharded
          # project keeps every SPEC_SHARDS-th file of the sorted list, starting at SPEC_SHARD.
          spec_list="$(./node_modules/.bin/playwright test --list --project "$project" --reporter=json | node -e '
            const chunks = [];
            process.stdin.on("data", (chunk) => chunks.push(chunk));
            process.stdin.on("end", () => {
              const files = new Set();
              const walk = (suite) => {
                for (const spec of suite.specs || []) files.add(spec.file);
                for (const child of suite.suites || []) walk(child);
              };
              for (const suite of JSON.parse(Buffer.concat(chunks).toString("utf8")).suites || []) walk(suite);
              const shard = Number(process.env.SPEC_SHARD), shards = Number(process.env.SPEC_SHARDS);
              [...files].sort().forEach((file, index) => {
                if (index % shards === shard - 1) console.log("e2e/" + file);
              });
            });
          ')"
          mapfile -t specs <<< "$spec_list"
          if [[ "${#specs[@]}" -eq 0 || -z "${specs[0]}" ]]; then
            echo "Playwright listed no browser specs for $project shard $SPEC_SHARD/$SPEC_SHARDS."
            exit 1
          fi
          current=""
          cleanup() {
            result=$?
            if [[ "$result" != "0" && -n "$current" ]]; then
              docker inspect --format 'fixture state={{.State.Status}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' "$current" >&2 || true
              docker logs "$current" >&2 || true
            fi
            docker rm --force "$prefix-0" "$prefix-1" "$prefix-net-0" "$prefix-net-1" >/dev/null 2>&1 || true
            return "$result"
          }
          trap cleanup EXIT
          # Starting a container adds a veth interface to the runner, and Chromium fails in-flight
          # requests with ERR_NETWORK_CHANGED. Each slot keeps one network namespace, created before
          # any browser runs, which every fixture of that slot joins without changing host interfaces.
          start_network() {
            local index="$1"
            docker run --detach --name "$(network_name "$index")" \
              --publish "127.0.0.1:$(container_port "$index"):8090" --no-healthcheck \
              --read-only --security-opt no-new-privileges:true --cap-drop=ALL \
              --pids-limit=16 --memory=32m --cpus=0.1 \
              ai-coach:ci sleep infinity >/dev/null
          }
          start_fixture() {
            local index="$1" name
            name="$(container_name "$index")"
            docker rm --force "$name" >/dev/null 2>&1 || true
            docker run --detach --name "$name" --network "container:$(network_name "$index")" \
              --read-only --security-opt no-new-privileges:true --cap-drop=ALL \
              --pids-limit=256 --memory=1g --cpus=2 --tmpfs /data:uid=100,gid=101,mode=0700 --tmpfs /tmp \
              --env APP_PASSWORD="$E2E_APP_PASSWORD" --env COOKIE_SECURE=false \
              --env AI_COACH_DISPOSABLE_FIXTURE=1 \
              --volume "${GITHUB_WORKSPACE}/e2e:/app/e2e:ro" \
              ai-coach:ci python /app/e2e/fixture_runtime.py >/dev/null
          }
          wait_healthy() {
            local index="$1" spec="$2" port
            port="$(container_port "$index")"
            for attempt in {1..90}; do
              if curl --fail --silent "http://127.0.0.1:$port/api/health" >/dev/null && \
                curl --fail --silent "http://127.0.0.1:$port/" >/dev/null; then
                return 0
              fi
              if [[ "$attempt" == "90" ]]; then
                echo "The isolated fixture application did not become healthy for $project ($spec)."
                exit 1
              fi
              sleep 0.5
            done
          }
          # Each spec gets a fresh disposable fixture because some specs delete data and sessions.
          start_network 0
          start_network 1
          # Let the new veth link-local addresses finish duplicate address detection before Chromium starts.
          for attempt in {1..50}; do
            [[ -z "$(ip -6 address show tentative)" ]] && break
            sleep 0.2
          done
          start_fixture 0
          for i in "${!specs[@]}"; do
            spec="${specs[$i]}"
            name="$(container_name "$i")"
            port="$(container_port "$i")"
            current="$name"
            wait_healthy "$i" "$spec"
            if (( i + 1 < ${#specs[@]} )); then
              # Point failure diagnostics at the prewarmed slot until it has started.
              current="$(container_name "$((i + 1))")"
              start_fixture "$((i + 1))"
              current="$name"
            fi
            spec_name="$(basename "$spec" .spec.js)"
            PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$spec_name" \
              E2E_BASE_URL="http://127.0.0.1:$port" \
              npm run test:e2e -- "$spec" --project "$project" --output "test-results/$spec_name"
            docker rm --force "$name" >/dev/null 2>&1 || true
            current=""
          done
      # Traces are disabled in CI (playwright.config.cjs): CI artifacts are public and traces
      # embed the fixture session. playwright/.auth is never uploaded.
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-artifacts-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove isolated fixture application
        if: always()
        run: |
          docker rm --force ai-coach-e2e-0 ai-coach-e2e-1 ai-coach-e2e-net-0 ai-coach-e2e-net-1 >/dev/null 2>&1 || true

  browser:
    if: always()
    needs: e2e
    name: Browser checks
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate browser results
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$E2E_RESULT" != "success" ]]; then
            echo "Browser checks: $E2E_RESULT"
            exit 1
          fi
          echo "All browser projects passed."

  build-and-push:
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_container == true)
    needs: [source, test, e2e, browser, quality]
    runs-on: ubuntu-latest
    concurrency:
      group: container-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify build uses tested source and release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          TESTED_SHA: ${{ needs.source.outputs.source_sha }}
        run: python .github/scripts/release_source.py --verify "$TESTED_SHA"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}
            type=sha,format=long
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Build and push image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign published image digest
        env:
          COSIGN_YES: "true"
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          cosign sign "${image,,}@${{ steps.image.outputs.digest }}"
      - name: Verify image signature
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          SIGNING_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: >-
          cosign verify "${IMAGE,,}@${EXPECTED_DIGEST}"
          --certificate-identity "$SIGNING_IDENTITY"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Promote signed image and verify published tag digest parity
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          latest_release="$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$RELEASE_TAG" != "$latest_release" ]]; then
            echo "Refusing to replace latest with $RELEASE_TAG; current release is $latest_release."
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false --tag "$image:latest" "$image@$EXPECTED_DIGEST"
          for tag in "$RELEASE_TAG" latest; do
            actual_digest="$(docker buildx imagetools inspect "$image:$tag" | awk '/Digest:/ { print $2; exit }')"
            if [[ -z "$actual_digest" || "$actual_digest" != "$EXPECTED_DIGEST" ]]; then
              echo "Digest mismatch for $image:$tag: expected $EXPECTED_DIGEST, got ${actual_digest:-<missing>}"
              exit 1
            fi
          done
