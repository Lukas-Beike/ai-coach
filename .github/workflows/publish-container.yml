name: Test and publish container image

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish
        required: true
        type: string
      source_ref:
        description: Optional source reference; must identify the release tag commit
        required: false
        type: string
      publish_container:
        description: Publish the container after tests pass
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  source:
    name: Resolve immutable source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve source and release contract
        id: source
        env:
          SOURCE_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && (inputs.source_ref || inputs.release_tag) || github.sha }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: python .github/scripts/release_source.py

  test_shards:
    needs: source
    name: Test shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python tests/run_tests.py --shard "${{ matrix.shard }}" --total 4

  syntax:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run syntax checks
        run: python -m py_compile server.py tests/test_server.py tests/run_tests.py

  container_tests:
    needs: source
    name: Container unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      - name: Build isolated SQLCipher test image
        run: docker build --tag ai-coach:test .
      - name: Run unit tests in the container
        run: >-
          docker run --rm --read-only --security-opt no-new-privileges:true --cap-drop=ALL
          --pids-limit=256 --memory=512m --cpus=1 --tmpfs /tmp
          --volume "${GITHUB_WORKSPACE}/tests:/review/tests:ro"
          --volume "${GITHUB_WORKSPACE}/public:/review/public:ro"
          --volume "${GITHUB_WORKSPACE}/server.py:/review/server.py:ro"
          --volume "${GITHUB_WORKSPACE}/playwright.config.cjs:/review/playwright.config.cjs:ro"
          --volume "${GITHUB_WORKSPACE}/e2e:/app/e2e:ro"
          --volume "${GITHUB_WORKSPACE}/e2e:/review/e2e:ro"
          --volume "${GITHUB_WORKSPACE}/.github:/review/.github:ro"
          --env PYTHONPATH=/app:/review/tests --workdir /app ai-coach:test
          python /review/tests/run_tests.py

  test:
    if: always()
    needs: [test_shards, syntax, container_tests, image_sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate test and syntax results
        env:
          TEST_SHARDS_RESULT: ${{ needs.test_shards.result }}
          SYNTAX_RESULT: ${{ needs.syntax.result }}
          CONTAINER_TESTS_RESULT: ${{ needs.container_tests.result }}
          IMAGE_SBOM_RESULT: ${{ needs.image_sbom.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TEST_SHARDS_RESULT" != "success" || "$SYNTAX_RESULT" != "success" || "$CONTAINER_TESTS_RESULT" != "success" || "$IMAGE_SBOM_RESULT" != "success" ]]; then
            echo "Test shards: $TEST_SHARDS_RESULT; syntax: $SYNTAX_RESULT; container tests: $CONTAINER_TESTS_RESULT; image SBOM: $IMAGE_SBOM_RESULT"
            exit 1
          fi
          echo "All native shards, syntax checks, and container tests passed."

  quality:
    name: Quality baseline
    needs: [source, test]
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and quality dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Collect coverage baseline
        run: |
          coverage run --branch tests/run_tests.py --shard 1 --total 4
          coverage report --fail-under=0
      - name: Run lint baseline
        run: ruff check tests/run_tests.py
      - name: Run formatter baseline
        run: ruff format --check tests/run_tests.py
      - name: Run lightweight type baseline
        run: mypy --ignore-missing-imports --follow-imports=skip tests/run_tests.py

  image_sbom:
    needs: source
    name: Image SBOM
    runs-on: ubuntu-latest
    permissions:
      # Keep the security job read-only; the SBOM is stored as a workflow artifact.
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      - name: Build isolated image for scanning
        run: docker build --tag ai-coach:security .
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ai-coach:security
          format: spdx-json
          output-file: ai-coach-sbom.spdx.json
          upload-release-assets: false
      - name: Upload image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-coach-sbom
          path: ai-coach-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
  e2e:
    if: needs.test.result == 'success'
    needs: [source, test]
    name: Browser smoke and accessibility checks
    runs-on: ubuntu-latest
    env:
      # This is an isolated fixture credential, never a repository or provider secret.
      E2E_APP_PASSWORD: e2e-fixture-password-1234
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build isolated application image
        run: docker build --tag ai-coach:e2e .
      - name: Run browser smoke and accessibility checks
        shell: bash
        run: |
          set -euo pipefail
          projects=(mobile-small mobile tablet tablet-landscape desktop)
          cleanup() { docker rm --force ai-coach-e2e >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for project in "${projects[@]}"; do
            cleanup
            docker run --detach --name ai-coach-e2e --publish 127.0.0.1:8090:8090 \
              --read-only --security-opt no-new-privileges:true --cap-drop=ALL \
              --pids-limit=256 --memory=512m --cpus=1 --tmpfs /data:uid=100,gid=101,mode=0700 --tmpfs /tmp \
              --env APP_PASSWORD="$E2E_APP_PASSWORD" --env COOKIE_SECURE=false \
              --volume "${GITHUB_WORKSPACE}/e2e:/app/e2e:ro" \
              ai-coach:e2e python /app/e2e/fixture_runtime.py >/dev/null
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:8090/api/health >/dev/null; then
                break
              fi
              if [[ "$attempt" == "30" ]]; then
                echo "The isolated fixture application did not become healthy for $project."
                exit 1
              fi
              sleep 2
            done
            npm run test:e2e -- --project "$project"
          done
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove isolated fixture application
        if: always()
        run: docker rm --force ai-coach-e2e >/dev/null 2>&1 || true

  build-and-push:
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && inputs.publish_container == true)
    needs: [source, test, e2e, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          fetch-depth: 0
      - name: Verify build uses tested source and release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          TESTED_SHA: ${{ needs.source.outputs.source_sha }}
        run: python .github/scripts/release_source.py --verify "$TESTED_SHA"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}
            type=sha,format=long
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign published image digest
        env:
          COSIGN_YES: "true"
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          cosign sign "${image,,}@${{ steps.image.outputs.digest }}"
