name: Daily OpenSpec update

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: openspec-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs the pinned CLI without any write token; only a patch leaves this job.
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      base: ${{ steps.diff.outputs.base }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - name: Check out develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked OpenSpec
        run: npm ci --ignore-scripts
      - name: Regenerate OpenSpec skills
        run: npm run openspec -- update
      - name: Collect generated changes
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          git add --all
          git diff --cached --binary > openspec-update.patch
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@fission-ai/openspec'].version")" >> "$GITHUB_OUTPUT"
          if [[ -s openspec-update.patch ]]; then
            git diff --cached --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "OpenSpec skills are current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openspec-update
          path: openspec-update.patch
          retention-days: 1

  publish:
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the regenerated base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.regenerate.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openspec-update
          path: ${{ runner.temp }}/openspec-update
      - name: Apply generated skill changes only
        shell: bash
        env:
          PATCH: ${{ runner.temp }}/openspec-update/openspec-update.patch
        run: |
          set -euo pipefail
          # Must match tools/bot_merge.py OPENSPEC_FILES.
          allowed='^\.agents/skills/(\.openspec-target|openspec-[a-z0-9-]+/SKILL\.md)$'
          outside="$(git apply --numstat -z "$PATCH" | tr '\0' '\n' | cut -f3 | grep -Ev "$allowed" | grep -v '^$' || true)"
          if [[ -n "$outside" ]]; then
            echo "openspec update changed files outside the generated skills:" >&2
            echo "$outside" >&2
            exit 1
          fi
          if git apply --summary "$PATCH" | grep -E 'mode change|120000'; then
            echo "openspec update changed file modes or added symlinks." >&2
            exit 1
          fi
          git apply --index "$PATCH"
      - name: Create release GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.0.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the OpenSpec PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.regenerate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          branch=chore/openspec-update
          title="chore(openspec): regenerate skills with OpenSpec $VERSION"
          rejected="$(gh pr list --repo "$REPOSITORY" --base develop --head "$branch" --state closed --search "\"$title\" in:title is:unmerged" --json number --jq '.[0].number // empty')"
          if [[ -n "$rejected" ]]; then
            echo "PR #$rejected for OpenSpec $VERSION was closed without merging; not reopening."
            exit 0
          fi
          tree="$(git write-tree)"
          remote_tree="$(gh api "repos/$REPOSITORY/branches/$branch" --jq '.commit.commit.tree.sha' 2>/dev/null || true)"
          if [[ "$remote_tree" == "$tree" ]]; then
            echo "Branch $branch already holds this regeneration."
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "$title"
            git -c core.hooksPath=/dev/null push --force \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" \
              "HEAD:refs/heads/$branch"
          fi
          pr="$(gh pr list --repo "$REPOSITORY" --base develop --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            pr="$(gh pr create --repo "$REPOSITORY" --base develop --head "$branch" \
              --title "$title" \
              --body "Daily \`openspec update\` with the CLI pinned in \`package-lock.json\` changed the generated OpenSpec skills.")"
          fi
          gh pr merge "$pr" --repo "$REPOSITORY" --auto --squash
