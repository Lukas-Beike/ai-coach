name: Codex review gate

on:
  # pull_request_target runs the workflow and local action from the trusted
  # target branch. This workflow never checks out or executes pull-request code.
  pull_request_target:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Allow a manually requested @codex review to start or restart the gate.
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: write

concurrency:
  group: >-
    codex-review-gate-${{ github.event.pull_request.number || github.event.issue.number }}-${{
    (github.event_name == 'pull_request_target' ||
    (github.event_name == 'issue_comment' &&
    github.event.issue.pull_request &&
    github.event.comment.user.type != 'Bot' &&
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
    contains(github.event.comment.body, '@codex review'))) && 'active' || github.run_id
    }}
  cancel-in-progress: true

jobs:
  gate:
    name: Coordinate Codex review
    if: >-
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft != true) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '@codex review'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve trusted pull-request base
        id: resolve_base
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const pullRequestNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequestNumber,
            });
            if (!['develop', 'main'].includes(response.data.base.ref)) {
              core.setFailed(`Unsupported pull-request base: ${response.data.base.ref}`);
              return;
            }
            core.setOutput('base_sha', response.data.base.sha);

      - name: Check out trusted workflow sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve_base.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Wait for the subscription-backed Codex review
        uses: ./.github/actions/codex-review-gate
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.event.issue.number }}
          check-name: Codex code review
          codex-bot-logins: chatgpt-codex-connector[bot],chatgpt-codex-connector
          timeout-seconds: 2400
          poll-seconds: 30
