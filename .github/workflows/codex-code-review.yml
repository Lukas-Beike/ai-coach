name: Codex review gate

on:
  # Re-evaluate open pull requests when their target branch advances. The
  # resulting check remains blocking until a fresh review is requested.
  push:
    branches: [develop, main]
  # pull_request_target runs the workflow and local action from the trusted
  # target branch. This workflow never checks out or executes pull-request code.
  pull_request_target:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # Allow a manually requested @codex review to start or restart the gate.
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: write

jobs:
  discover:
    name: Find PRs requiring a Codex review
    outputs:
      pull_requests: ${{ steps.resolve_base.outputs.pull_requests }}
      has_pull_requests: ${{ steps.resolve_base.outputs.has_pull_requests }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve affected pull requests
        id: resolve_base
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            let affectedPullRequests = [];
            const releaseBotLogin = 'ai-coach-release-bot[bot]';
            const releaseVersionPattern = /^chore\/release-version-(\d+\.\d+\.\d+)$/;
            const shouldSkipCodexReview = (pullRequest) => {
              const versionMatch = releaseVersionPattern.exec(pullRequest.head?.ref || '');
              return (
                pullRequest.user?.login === releaseBotLogin &&
                pullRequest.base?.ref === 'develop' &&
                versionMatch &&
                pullRequest.title === `chore(release): set application version to ${versionMatch[1]}`
              );
            };
            if (context.eventName === 'push') {
              const base = context.ref.replace(/^refs\/heads\//, '');
              const pullRequests = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base,
                per_page: 100,
              });
              affectedPullRequests = pullRequests
                .filter((pullRequest) => pullRequest.draft !== true)
                .map((pullRequest) => ({
                  pullRequestNumber: pullRequest.number,
                  baseRef: base,
                  reviewRequestedAt: '',
                  skipCodexReview: shouldSkipCodexReview(pullRequest),
                }));
            } else if (context.eventName === 'pull_request_target') {
              const pullRequest = context.payload.pull_request;
               const baseChanged = context.payload.action === 'edited' && context.payload.changes?.base;
              if (
                pullRequest.draft !== true &&
                ['develop', 'main'].includes(pullRequest.base.ref) &&
                (context.payload.action !== 'edited' || baseChanged)
              ) {
                affectedPullRequests = [{
                  pullRequestNumber: pullRequest.number,
                  baseRef: pullRequest.base.ref,
                  reviewRequestedAt: baseChanged ? pullRequest.updated_at : '',
                  skipCodexReview: shouldSkipCodexReview(pullRequest),
                }];
              }
            } else if (
              context.eventName === 'issue_comment' &&
              context.payload.issue?.pull_request &&
              context.payload.comment?.user?.type !== 'Bot' &&
              ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(context.payload.comment.author_association) &&
              (context.payload.comment.body || '').includes('@codex review')
            ) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              if (['develop', 'main'].includes(response.data.base.ref) && response.data.draft !== true) {
                affectedPullRequests = [{
                  pullRequestNumber: response.data.number,
                  baseRef: response.data.base.ref,
                  reviewRequestedAt: context.payload.comment.created_at,
                  skipCodexReview: shouldSkipCodexReview(response.data),
                }];
              }
            }
            core.setOutput('has_pull_requests', affectedPullRequests.length > 0 ? 'true' : 'false');
            if (affectedPullRequests.length === 0) {
              affectedPullRequests = [{
                pullRequestNumber: 0,
                baseRef: 'none',
                reviewRequestedAt: '',
                skipCodexReview: false,
                skip: true,
              }];
            }
            core.setOutput('pull_requests', JSON.stringify({
              include: affectedPullRequests,
            }));

  gate:
    name: Coordinate Codex review (${{ matrix.pullRequestNumber }})
    needs: discover
    if: needs.discover.outputs.has_pull_requests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.pull_requests) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: write
    timeout-minutes: 45
    concurrency:
      group: codex-review-gate-${{ matrix.pullRequestNumber }}-active
      cancel-in-progress: true
    steps:
      - name: Resolve trusted pull-request base
        id: resolve_base
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ matrix.pullRequestNumber }}
          EXPECTED_BASE_REF: ${{ matrix.baseRef }}
        with:
          github-token: ${{ github.token }}
          script: |
            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (
              !['develop', 'main'].includes(response.data.base.ref) ||
              response.data.base.ref !== process.env.EXPECTED_BASE_REF
            ) {
              core.setFailed(`Unsupported pull-request base: ${response.data.base.ref}`);
              return;
            }

      - name: Mark trusted release-bot version PR as Codex-exempt
        if: matrix.skipCodexReview == true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ matrix.pullRequestNumber }}
        with:
          github-token: ${{ github.token }}
          script: |
            const releaseBotLogin = 'ai-coach-release-bot[bot]';
            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pullRequest.data.user?.login !== releaseBotLogin) {
              core.setFailed('The Codex exemption was requested for an untrusted pull-request author.');
              return;
            }

            const versionMatch = /^chore\/release-version-(\d+\.\d+\.\d+)$/.exec(
              pullRequest.data.head.ref || '',
            );
            const version = versionMatch?.[1];
            const expectedTitle = version
              ? `chore(release): set application version to ${version}`
              : '';
            const expectedHeadRepository = `${context.repo.owner}/${context.repo.repo}`;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });
            const file = files.length === 1 ? files[0] : null;
            const changedLines = file
              ? String(file.patch || '')
                .split('\n')
                .filter((line) => /^[+-](?!\+\+\+|---)/.test(line))
              : [];
            const hasExpectedVersion = changedLines.includes(`+APP_VERSION = "${version}"`);
            const hasPreviousVersion = changedLines.some((line) => (
              /^-APP_VERSION = "\d+\.\d+\.\d+"$/.test(line)
            ));
            if (
              !version ||
              pullRequest.data.title !== expectedTitle ||
              pullRequest.data.base.ref !== 'develop' ||
              pullRequest.data.head.repo?.full_name !== expectedHeadRepository ||
              !file ||
              file.filename !== 'server.py' ||
              file.status !== 'modified' ||
              file.additions !== 1 ||
              file.deletions !== 1 ||
              file.changes !== 2 ||
              changedLines.length !== 2 ||
              !hasExpectedVersion ||
              !hasPreviousVersion
            ) {
              core.setFailed(
                'The release-bot Codex exemption requires an exact develop version-bump PR ' +
                'that changes only APP_VERSION in server.py.',
              );
              return;
            }

            const headSha = pullRequest.data.head.sha;
            const output = {
              title: 'Codex review skipped for trusted release-bot version PR',
              summary: `The trusted release bot owns this exact version-only release pull request for ${version} (${headSha}); no Codex review is required.`,
            };
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              per_page: 100,
            });
            const existingRun = checkRuns
              .filter((run) => run.name === 'Codex code review')
              .find((run) => run.status !== 'completed');
            const now = new Date().toISOString();
            if (existingRun) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: existingRun.id,
                status: 'completed',
                conclusion: 'success',
                completed_at: now,
                output,
              });
            } else {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Codex code review',
                head_sha: headSha,
                status: 'completed',
                conclusion: 'success',
                started_at: now,
                completed_at: now,
                output,
              });
            }

      - name: Check out trusted develop workflow sources
        if: matrix.skipCodexReview != true && matrix.baseRef == 'develop'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Check out trusted main workflow sources
        if: matrix.skipCodexReview != true && matrix.baseRef == 'main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Block until a fresh Codex review is requested
        if: matrix.skipCodexReview != true && github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ matrix.pullRequestNumber }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const headSha = pullRequest.data.head.sha;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Codex code review',
              head_sha: headSha,
              status: 'completed',
              conclusion: 'failure',
              started_at: new Date().toISOString(),
              completed_at: new Date().toISOString(),
              output: {
                title: 'Fresh Codex review required',
                summary: `The target branch advanced. Comment @codex review on PR #${pullRequest.data.number} to obtain a review against the current base.`,
              },
            });

      - name: Wait for the subscription-backed Codex review
        if: matrix.skipCodexReview != true && github.event_name != 'push'
        uses: ./.github/actions/codex-review-gate
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ matrix.pullRequestNumber }}
          review-requested-at: ${{ matrix.reviewRequestedAt }}
          check-name: Codex code review
          codex-bot-logins: chatgpt-codex-connector[bot],chatgpt-codex-connector
          timeout-seconds: 2400
          poll-seconds: 30
