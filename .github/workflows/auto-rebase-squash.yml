name: Auto-rebase squash auto-merge PRs

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: auto-rebase-develop
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Create branch update GitHub App token
        id: branch-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Rebase eligible pull requests
        env:
          # App-authored updates emit synchronize events and start fresh CI.
          GH_TOKEN: ${{ steps.branch-app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t pull_requests < <(
            gh pr list \
              --repo "$REPOSITORY" \
              --base develop \
              --state open \
              --limit 1000 \
              --json number,headRefName,isCrossRepository,autoMergeRequest \
              --jq '
                .[]
                | select(.isCrossRepository == false)
                | select(.autoMergeRequest != null)
                | select(.autoMergeRequest.mergeMethod == "SQUASH")
                | [.number, .headRefName]
                | @tsv
              '
          )

          if ((${#pull_requests[@]} == 0)); then
            echo "No open same-repository PR with squash auto-merge found."
            exit 0
          fi

          for pull_request in "${pull_requests[@]}"; do
            IFS=$'\t' read -r pull_request_number head_ref <<< "$pull_request"
            echo "Rebasing PR #$pull_request_number ($head_ref) onto develop."
            gh pr update-branch "$pull_request_number" \
              --repo "$REPOSITORY" \
              --rebase
          done
