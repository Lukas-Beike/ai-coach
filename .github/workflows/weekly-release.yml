name: Weekly release

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: weekly-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'chore/release-version-'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Create weekly release with commit changelog
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(gh release list --repo "$REPOSITORY" --limit 100 --json tagName,publishedAt,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false) | select(.tagName | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.publishedAt) | last | .tagName // empty')"
          if [[ -n "$latest_tag" ]]; then
            IFS=. read -r major minor patch <<< "$latest_tag"
            next_tag="${major}.${minor}.$((patch + 1))"
            if ! git rev-parse --verify --quiet "${latest_tag}^{commit}" >/dev/null; then
              git fetch --no-tags origin "refs/tags/${latest_tag}:refs/tags/${latest_tag}"
            fi
          else
            next_tag="0.0.1"
          fi

          if gh release view "$next_tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $next_tag already exists; nothing to do."
            exit 0
          fi

          current_app_version="$(sed -nE 's/^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' server.py)"
          if [[ -z "$current_app_version" ]]; then
            echo "Could not read APP_VERSION from server.py."
            exit 1
          fi
          if [[ "$current_app_version" != "$next_tag" ]]; then
            version_branch="chore/release-version-$next_tag"
            existing_pr="$(gh pr list --repo "$REPOSITORY" --base main --head "$version_branch" --state open --json number --jq '.[0].number // empty')"
            if [[ -n "$existing_pr" ]]; then
              echo "Version bump PR #$existing_pr is already open; merge it before creating the release."
              exit 0
            fi
            if git ls-remote --exit-code --heads origin "$version_branch" >/dev/null 2>&1; then
              echo "Remote branch $version_branch exists without an open PR; refusing to overwrite it."
              exit 1
            fi
            git switch --create "$version_branch"
            sed -i -E "s/^APP_VERSION = \"[0-9]+\.[0-9]+\.[0-9]+\"$/APP_VERSION = \"$next_tag\"/" server.py
            updated_app_version="$(sed -nE 's/^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' server.py)"
            if [[ "$updated_app_version" != "$next_tag" ]]; then
              echo "Failed to update APP_VERSION to $next_tag."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server.py
            git commit -m "chore(release): set application version to $next_tag"
            git push --set-upstream origin "$version_branch"
            gh pr create \
              --repo "$REPOSITORY" \
              --base main \
              --head "$version_branch" \
              --title "chore(release): set application version to $next_tag" \
              --body "Synchronize APP_VERSION with the upcoming GitHub release $next_tag. Merge this PR before the next weekly release run."
            echo "Created version bump PR for $next_tag; release creation will continue after it is merged."
            exit 0
          fi

          release_sha="$(git rev-parse HEAD)"
          if [[ -n "$latest_tag" ]]; then
            commit_range="${latest_tag}..${release_sha}"
            compare_url="https://github.com/${REPOSITORY}/compare/${latest_tag}...${release_sha}"
          else
            commit_range="$release_sha"
            compare_url="https://github.com/${REPOSITORY}/commits/${release_sha}"
          fi

          notes_file="${RUNNER_TEMP}/weekly-release-notes.md"
          {
            echo "## Änderungen seit ${latest_tag:-Projektbeginn}"
            echo
            git log --format='- %s (%h)' "$commit_range"
            echo
            echo "[Vollständigen Commit-Vergleich ansehen](${compare_url})"
          } > "$notes_file"

          gh release create "$next_tag" \
            --repo "$REPOSITORY" \
            --target "$release_sha" \
            --title "$next_tag" \
            --notes-file "$notes_file"

          # Releases created with GITHUB_TOKEN do not emit a release event that
          # can start another workflow, so dispatch the image workflow explicitly.
          gh workflow run publish-container.yml \
            --repo "$REPOSITORY" \
            --ref main \
            --field "release_tag=$next_tag"
