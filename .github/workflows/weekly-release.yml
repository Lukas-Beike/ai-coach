name: Daily release

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional target version, for example 1.2.0 or 2.0.0
        required: false
        type: string
  pull_request:
    types: [closed]
    branches: [develop, main]

concurrency:
  group: daily-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  prepare-version:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' && startsWith(github.event.pull_request.head.ref, 'chore/release-version-'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Create version bump PR or promote release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          app_version="$(sed -nE 's/^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' server.py)"
          if [[ -z "$app_version" ]]; then
            echo "Could not read APP_VERSION from server.py."
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$app_version"
          next_tag="${major}.${minor}.$((patch + 1))"
          if [[ -n "$REQUESTED_VERSION" ]]; then
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Requested release version must use MAJOR.MINOR.PATCH format."
              exit 1
            fi
            next_tag="$REQUESTED_VERSION"
          fi

          version_is_greater() {
            local left_major left_minor left_patch right_major right_minor right_patch
            IFS=. read -r left_major left_minor left_patch <<< "$1"
            IFS=. read -r right_major right_minor right_patch <<< "$2"
            if (( left_major != right_major )); then
              if (( left_major > right_major )); then return 0; fi
              return 1
            fi
            if (( left_minor != right_minor )); then
              if (( left_minor > right_minor )); then return 0; fi
              return 1
            fi
            if (( left_patch > right_patch )); then return 0; fi
            return 1
          }

          enable_auto_merge() {
            local pull_request_number="$1"
            local auto_merge_enabled
            auto_merge_enabled="$(gh pr view "$pull_request_number" --repo "$REPOSITORY" --json autoMergeRequest --jq 'if .autoMergeRequest == null then "false" else "true" end')"
            if [[ "$auto_merge_enabled" != "true" ]]; then
              gh pr merge "$pull_request_number" --repo "$REPOSITORY" --auto --squash
            fi
          }

          version_merge=false
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_MERGED" == "true" && "$PR_BASE" == "develop" && "$PR_HEAD" == chore/release-version-* ]]; then
            version_merge=true
          fi

          latest_tag="$(gh release list --repo "$REPOSITORY" --limit 100 --json tagName,publishedAt,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false) | select(.tagName | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.publishedAt) | last | .tagName // empty')"
          if [[ -n "$latest_tag" ]]; then
            if ! git rev-parse --verify --quiet "refs/tags/$latest_tag" >/dev/null; then
              git fetch --no-tags origin "refs/tags/$latest_tag:refs/tags/$latest_tag"
            fi
            release_base="$(git merge-base "$latest_tag" HEAD 2>/dev/null || true)"
            if [[ -z "$release_base" ]]; then
              release_tree="$(git show -s --format='%T' "$latest_tag")"
              while read -r candidate_commit candidate_tree; do
                if [[ "$candidate_tree" == "$release_tree" ]]; then
                  release_base="$candidate_commit"
                  break
                fi
              done < <(git log HEAD --format='%H %T')
            fi
            if [[ -z "$release_base" ]]; then
              echo "Could not find the latest release tree in develop; refusing to guess the commit count."
              exit 1
            fi
            commit_count="$(git rev-list --count "${release_base}..HEAD")"
          else
            commit_count="$(git rev-list --count HEAD)"
          fi
          echo "Commits since latest release: $commit_count"

          if [[ "$version_merge" == "true" ]]; then
            if [[ -z "$latest_tag" ]]; then
              echo "Cannot validate the merged version bump without a previous release tag."
              exit 1
            fi
            merged_version="${PR_HEAD#chore/release-version-}"
            if [[ ! "$merged_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$app_version" != "$merged_version" ]]; then
              echo "Merged APP_VERSION $app_version does not match the version bump branch $PR_HEAD."
              exit 1
            fi
            if ! version_is_greater "$app_version" "$latest_tag"; then
              echo "Merged APP_VERSION $app_version must be greater than the latest release $latest_tag."
              exit 1
            fi
          elif [[ -n "$latest_tag" && "$latest_tag" != "$app_version" ]] && ! version_is_greater "$app_version" "$latest_tag"; then
            echo "APP_VERSION $app_version is older than the latest release tag $latest_tag."
            exit 1
          fi

          pending_promotion=false
          if [[ -n "$latest_tag" && "$app_version" != "$latest_tag" ]]; then
            pending_promotion=true
          fi

          if [[ "$pending_promotion" == "true" ]]; then
            if [[ "$version_merge" != "true" && -n "$REQUESTED_VERSION" ]]; then
              echo "Cannot choose $REQUESTED_VERSION while APP_VERSION $app_version is waiting for promotion."
              exit 1
            fi
            promotion_branch="chore/release-promotion-$app_version"
            existing_pr="$(gh pr list --repo "$REPOSITORY" --base main --head "$promotion_branch" --state open --json number --jq '.[0].number // empty')"
            if [[ -n "$existing_pr" ]]; then
              echo "Release promotion PR #$existing_pr is already open."
              enable_auto_merge "$existing_pr"
              exit 0
            fi
            if git ls-remote --exit-code --heads origin "$promotion_branch" >/dev/null 2>&1; then
              echo "Remote branch $promotion_branch exists without an open PR; refusing to overwrite it."
              exit 1
            fi

            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch --create "$promotion_branch"
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit --strategy=ours origin/main \
                -m "chore(release): synchronize promotion branch with main"
            fi
            git push --set-upstream origin "$promotion_branch"
            promotion_pr_url="$(gh pr create \
              --repo "$REPOSITORY" \
              --base main \
              --head "$promotion_branch" \
              --title "chore(release): promote $app_version to main" \
              --body "Promote APP_VERSION $app_version from develop to protected main. Merge this PR to create the GitHub release and publish the container.")"
            enable_auto_merge "$promotion_pr_url"
            exit 0
          fi

          if [[ "$commit_count" -eq 0 && -z "$REQUESTED_VERSION" ]]; then
            echo "No commits since the latest release; nothing to do."
            exit 0
          fi

          if ! version_is_greater "$next_tag" "$app_version"; then
            echo "Release version $next_tag must be greater than APP_VERSION $app_version."
            exit 1
          fi

          if gh release view "$next_tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $next_tag already exists; nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$next_tag" >/dev/null 2>&1; then
            echo "Tag $next_tag already exists without a GitHub release; refusing to overwrite it."
            exit 1
          fi

          version_branch="chore/release-version-$next_tag"
          existing_pr="$(gh pr list --repo "$REPOSITORY" --base develop --head "$version_branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Version bump PR #$existing_pr is already open; merge it before the next release run."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$version_branch" >/dev/null 2>&1; then
            echo "Remote branch $version_branch exists without an open PR; refusing to overwrite it."
            exit 1
          fi

          git switch --create "$version_branch"
          sed -i -E "s/^APP_VERSION = \"[0-9]+\.[0-9]+\.[0-9]+\"$/APP_VERSION = \"$next_tag\"/" server.py
          updated_app_version="$(sed -nE 's/^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' server.py)"
          if [[ "$updated_app_version" != "$next_tag" ]]; then
            echo "Failed to update APP_VERSION to $next_tag."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          git commit -m "chore(release): set application version to $next_tag"
          git push --set-upstream origin "$version_branch"
          version_pr_url="$(gh pr create \
            --repo "$REPOSITORY" \
            --base develop \
            --head "$version_branch" \
            --title "chore(release): set application version to $next_tag" \
            --body "Synchronize APP_VERSION with the upcoming GitHub release $next_tag. Merge this PR to promote the release to main.")"
          enable_auto_merge "$version_pr_url"

  create-release:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'chore/release-promotion-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Create release with commit changelog
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="$(sed -nE 's/^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' server.py)"
          if [[ -z "$release_tag" ]]; then
            echo "Could not read APP_VERSION from server.py."
            exit 1
          fi

          latest_tag="$(gh release list --repo "$REPOSITORY" --limit 100 --json tagName,publishedAt,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false) | select(.tagName | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.publishedAt) | last | .tagName // empty')"
           if [[ -n "$latest_tag" ]]; then
             version_is_greater() {
               local left_major left_minor left_patch right_major right_minor right_patch
               IFS=. read -r left_major left_minor left_patch <<< "$1"
               IFS=. read -r right_major right_minor right_patch <<< "$2"
               if (( left_major != right_major )); then
                 if (( left_major > right_major )); then return 0; fi
                 return 1
               fi
               if (( left_minor != right_minor )); then
                 if (( left_minor > right_minor )); then return 0; fi
                 return 1
               fi
               if (( left_patch > right_patch )); then return 0; fi
               return 1
             }
             if ! version_is_greater "$release_tag" "$latest_tag"; then
               echo "APP_VERSION $release_tag must be greater than the latest release $latest_tag."
               exit 1
             fi
             if ! git rev-parse --verify --quiet "${latest_tag}^0" >/dev/null; then
               git fetch --no-tags origin "refs/tags/${latest_tag}:refs/tags/${latest_tag}"
             fi
           fi

           git fetch --no-tags origin refs/heads/develop:refs/remotes/origin/develop
           develop_release_tree="$(git show -s --format='%T' HEAD)"
           develop_release_base=""
           while read -r candidate_commit candidate_tree; do
             if [[ "$candidate_tree" == "$develop_release_tree" ]]; then
               develop_release_base="$candidate_commit"
               break
             fi
           done < <(git log origin/develop --format='%H %T')
           if [[ -z "$develop_release_base" ]]; then
             echo "Could not map the release commit to develop; refusing to create an incomplete changelog."
             exit 1
           fi

           if [[ -n "$latest_tag" ]]; then
             latest_release_tree="$(git show -s --format='%T' "$latest_tag")"
             latest_release_base=""
             while read -r candidate_commit candidate_tree; do
               if [[ "$candidate_tree" == "$latest_release_tree" ]]; then
                 latest_release_base="$candidate_commit"
                 break
               fi
             done < <(git log origin/develop --format='%H %T')
             if [[ -z "$latest_release_base" ]]; then
               echo "Could not map the previous release to develop; refusing to create an incomplete changelog."
               exit 1
             fi
             commit_range="${latest_release_base}..${develop_release_base}"
             compare_url="https://github.com/${REPOSITORY}/compare/${latest_tag}...${develop_release_base}"
           else
             commit_range="$develop_release_base"
             compare_url="https://github.com/${REPOSITORY}/commits/${develop_release_base}"
           fi

          if gh release view "$release_tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Tag $release_tag already exists without a GitHub release; refusing to overwrite it."
            exit 1
          fi

          release_sha="$(git rev-parse HEAD)"
          notes_file="${RUNNER_TEMP}/weekly-release-notes.md"
          {
            echo "## Changes since ${latest_tag:-project start}"
            echo
            git log --format='- %s (%h)' "$commit_range"
            echo
            echo "[View the full commit comparison](${compare_url})"
          } > "$notes_file"

          gh release create "$release_tag" \
            --repo "$REPOSITORY" \
            --target "$release_sha" \
            --title "$release_tag" \
            --notes-file "$notes_file"

          # Releases created with GITHUB_TOKEN do not emit a release event that
          # can start another workflow, so dispatch the image workflow explicitly.
          gh workflow run publish-container.yml \
            --repo "$REPOSITORY" \
            --ref main \
            --field "release_tag=$release_tag"
