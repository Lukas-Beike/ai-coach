name: Validate Conventional Commits

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  # Issues: closingIssuesReferences reads the linked issues (#2648).
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title and commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          conventional_regex='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]*\))?!?: .+'

          if [[ ! "$PR_TITLE" =~ $conventional_regex ]]; then
            echo "Invalid PR title: $PR_TITLE"
            echo "Expected: <type>(<optional-scope>): <description>"
            exit 1
          fi

          subjects="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/commits" --paginate --jq '.[].commit.message | split("\n")[0]')"
          if [[ -z "$subjects" ]]; then
            echo "No commit subjects returned for the pull request."
            exit 1
          fi

          invalid=0
          while IFS= read -r subject; do
            if [[ ! "$subject" =~ $conventional_regex ]]; then
              echo "Invalid commit subject: $subject"
              invalid=1
            fi
          done <<< "$subjects"

          if [[ "$invalid" -ne 0 ]]; then
            exit 1
          fi

      - name: Keep APP_VERSION at or above the base branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # A conflict resolution once reverted the released version (#2733). Both
          # files are read through the API, so no pull-request code runs here.
          version() {
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$REPOSITORY/contents/server.py?ref=$1" \
              | sed -nE 's/^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p'
          }
          base="$(version "$BASE_SHA")"
          head="$(version "$HEAD_SHA")"
          if [[ -z "$base" || -z "$head" ]]; then
            echo "APP_VERSION not found in server.py (base '${base}', head '${head}')."
            exit 1
          fi
          lowest="$(printf '%s\n%s\n' "$base" "$head" | sort -V | head -n 1)"
          if [[ "$head" != "$base" && "$lowest" == "$head" ]]; then
            echo "APP_VERSION $head is lower than $base on the base branch; keep the released version when resolving a conflict."
            exit 1
          fi

      - name: Require an issue link in the PR body
        if: github.event.pull_request.user.type != 'Bot'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          # Multi-PR issues use "Part of #N"; the last PR uses "Closes #N".
          link_regex='(^|[^[:alnum:]_])([Cc]loses|[Ff]ixes|[Rr]esolves|[Pp]art of) #[0-9]+'
          if [[ ! "${PR_BODY:-}" =~ $link_regex ]]; then
            echo "The PR body must name its issue with 'Closes #N' (completes it) or 'Part of #N' (one of several PRs)."
            exit 1
          fi
          # GitHub closes every issue its keyword parser finds, also in "does not
          # close #N"; each one must be meant with "Closes/Fixes/Resolves #N" (#2648).
          # Closing references exist only for PRs into the default branch.
          [[ "${BASE_REF:-}" == "${DEFAULT_BRANCH:-}" ]] || exit 0
          closes="$(grep -oiE '(^|[^[:alnum:]_])(closes|fixes|resolves) #[0-9]+' <<< "${PR_BODY:-}" \
            | grep -oE '[0-9]+$' | sed 's/^0*//' | sort -u || true)"
          # Every closing phrase GitHub may parse, also negated ones like "does not close #N".
          expected="$(grep -oiE '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):? *#[0-9]+' <<< "${PR_BODY:-}" \
            | grep -oE '[0-9]+$' | sed 's/^0*//' | sort -u || true)"
          # GitHub parses the body asynchronously: retry while its list still lacks a
          # phrase from the body or still holds an issue the body does not mean.
          for attempt in 1 2 3; do
            closing="$(gh api graphql -f owner="${REPOSITORY%%/*}" -f name="${REPOSITORY#*/}" -F number="$PR_NUMBER" \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){closingIssuesReferences(first:50){nodes{number repository{nameWithOwner}}}}}}' \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | select(.repository.nameWithOwner == env.REPOSITORY) | .number')"
            unmeant=""
            for issue in $closing; do
              grep -qx "$issue" <<< "$closes" || unmeant="$unmeant $issue"
            done
            pending=""
            for issue in $expected; do
              grep -qx "$issue" <<< "$closing" || pending="$pending $issue"
            done
            [[ -z "$unmeant" && -z "$pending" ]] && exit 0
            [[ "$attempt" -lt 3 ]] && sleep "${CLOSING_RETRY_SECONDS:-10}"
          done
          # A phrase GitHub never lists (in code or quotes) closes nothing.
          [[ -z "$unmeant" ]] && exit 0
          for issue in $unmeant; do
            phrase="$(grep -oiE "[[:alpha:] ]{0,20}(close[sd]?|fix(e[sd])?|resolve[sd]?):? *#$issue([^0-9]|$)" <<< "${PR_BODY:-}" | head -1 || true)"
            echo "GitHub will close #$issue on merge (phrase: '${phrase:-closing keyword}'), but the body does not say 'Closes #$issue'; reword it, for example '#$issue stays open'."
          done
          exit 1
