[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# ARG001-ARG004 match SonarCloud's unused-parameter rule (python:S1172), which
# failed the quality gate of #1505 after push; existing cases are ratchet debt.
extend-select = ["DTZ", "ARG001", "ARG002", "ARG003", "ARG004"]

[tool.ruff.lint.per-file-ignores]
# SonarCloud excludes tests/** and e2e/** from its sources (sonar-project.properties).
"tests/**" = ["ARG001", "ARG002", "ARG003", "ARG004"]
"e2e/**" = ["ARG001", "ARG002", "ARG003", "ARG004"]

[tool.mypy]
python_version = "3.14"
files = ["."]
ignore_missing_imports = true
follow_imports = "skip"
# CI runs on Linux; checking for it everywhere keeps Windows runs consistent.
platform = "linux"

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["server", "backend"]

[tool.coverage.report]
precision = 2
fail_under = 93.54
