services:
  intervals-coach:
    build: .
    container_name: intervals-coach
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "8090:8090"
    volumes:
      - /mnt/user/appdata/intervals-coach:/data
    env_file:
      - .env
    environment:
      - TZ=Europe/Berlin
      - PORT=8090

